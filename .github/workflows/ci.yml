name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.26.4
  GOFLAGS: -mod=readonly
  GO_VERSION: '1.26.4'
  CYCLONEDX_GOMOD_VERSION: 'v1.9.0'
  GOVULNCHECK_VERSION: 'v1.6.0'

jobs:
  quality-and-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Round6 safe sparse source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.round9-local-sandbox/**
            !/cmd/**/*[Ee][Vv][Aa][Ll][Uu][Aa][Tt][Ii][Oo][Nn]*
            !/cmd/**/*[Hh][Oo][Ll][Dd][Oo][Uu][Tt]*
            !/cmd/**/*[Cc][Oo][Nn][Ss][Uu][Mm][Ee][Dd]*
            !/cmd/**/*[Pp][Rr][Ii][Vv][Aa][Tt][Ee]*
            !/cmd/**/*[Bb][Ll][Ii][Nn][Dd]*
            !/cmd/**/*[Rr][Ee][Tt][Ii][Rr][Ee][Dd]*
            !/docs/**/*[Ee][Vv][Aa][Ll][Uu][Aa][Tt][Ii][Oo][Nn]*
            !/docs/**/*[Hh][Oo][Ll][Dd][Oo][Uu][Tt]*
            !/docs/**/*[Hh][Oo][Ll][Dd][Oo][Uu][Tt]_[Rr][Ee][Pp][Oo][Rr][Tt].[Mm][Dd]
            !/docs/**/*[Cc][Oo][Nn][Ss][Uu][Mm][Ee][Dd]*
            !/docs/**/*[Pp][Rr][Ii][Vv][Aa][Tt][Ee]*
            !/docs/**/*[Bb][Ll][Ii][Nn][Dd]*
            !/docs/**/*[Rr][Ee][Tt][Ii][Rr][Ee][Dd]*
            !/internal/classifier/**/*[Ee][Vv][Aa][Ll][Uu][Aa][Tt][Ii][Oo][Nn]*
            !/internal/classifier/**/*[Hh][Oo][Ll][Dd][Oo][Uu][Tt]*
            !/internal/classifier/**/*[Cc][Oo][Nn][Ss][Uu][Mm][Ee][Dd]*
            !/internal/classifier/**/*[Pp][Rr][Ii][Vv][Aa][Tt][Ee]*
            !/internal/classifier/**/*[Bb][Ll][Ii][Nn][Dd]*
            !/internal/classifier/**/*[Rr][Ee][Tt][Ii][Rr][Ee][Dd]*
            !/testdata/**/*[Ee][Vv][Aa][Ll][Uu][Aa][Tt][Ii][Oo][Nn]*
            !/testdata/**/*[Hh][Oo][Ll][Dd][Oo][Uu][Tt]*
            !/testdata/round9-independent-benign-v1/**
            !/testdata/round9-independent-malicious-v1/**
            !/testdata/**/*[Cc][Oo][Nn][Ss][Uu][Mm][Ee][Dd]*
            !/testdata/**/*[Pp][Rr][Ii][Vv][Aa][Tt][Ee]*
            !/testdata/**/*[Bb][Ll][Ii][Nn][Dd]*
            !/testdata/**/*[Rr][Ee][Tt][Ii][Rr][Ee][Dd]*
      - name: Recheck restricted-data and active-workflow contracts
        run: python3 -B scripts/round6_safe_gate_contract.py --root .
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install native verification dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils curl file jq zip unzip nginx
      - name: Install pinned security and SBOM tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          # shellcheck disable=SC2086
          GOBIN="$RUNNER_TEMP/bin" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}
          # shellcheck disable=SC2086
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: format
        run: make round6-format-check
      - name: git-diff-check
        run: make round6-git-diff-check
      - name: module-verify
        run: make round6-module-verify
      - name: Historical Round 8 counted-Mock regression
        run: make round8-counted-mock-historical-regression
      - name: CPA v7.2.116 pinned source API and SDK contract
        env:
          CPA_COMPAT_PROFILE: "primary"
          CPA_COMPAT_VERIFY_REMOTE: "1"
          CPA_COMPAT_REQUIRE_LATEST: "0"
        run: make cpa-latest-compat
      - name: round4-regression
        run: make round4-regression
      - name: round5-regression
        run: make round5-regression
      - name: round6-long-text-streaming-regression
        run: make round6-regression
      - name: unit-test
        run: make unit-test
      - name: race
        run: make race
      - name: vet
        run: make round6-vet
      - name: fuzz-smoke
        run: make fuzz-smoke
      - name: Round 9 bounded real fuzz
        run: make round9-fuzz
      - name: operational-script-security
        run: make round6-script-test
      - name: management-proxy-413
        run: make management-proxy-413-test
      - name: corpus-regression
        run: make corpus-regression
      - name: development-public-jailbreak-patterns-v1-validator
        run: make development-public-jailbreak-corpus
      - name: Round 9 semantic-vs-route corpus contract
        run: make round9-corpus-contract
      - name: Round 9 exact public adversarial corpus
        run: make round9-public-corpus
      - name: benchmark-acceptance
        run: make round6-benchmark
      - name: Round 10 bounded concurrency performance
        timeout-minutes: 12
        env:
          ROUND10_PERFORMANCE_OUTPUT: ${{ runner.temp }}/round10-performance.json
        run: make round10-performance ROUND10_PERFORMANCE_OUTPUT="$ROUND10_PERFORMANCE_OUTPUT"
      - name: Upload Round 10 performance JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: round10-performance-linux-amd64
          path: ${{ runner.temp }}/round10-performance.json
          if-no-files-found: warn
          retention-days: 14
      - name: dependency-vulnerability-gate
        run: make round6-vulncheck
      - name: Linux Host loads exact-merge clean audit candidate
        env:
          RELEASE_CANDIDATE_BUILD: '1'
          REQUIRE_DIST_ARTIFACTS: '1'
          ROUND6_SAFE_SPARSE_BUILD: '1'
        run: |
          RELEASE_CANDIDATE_EXPECTED_COMMIT="$GITHUB_SHA"
          RELEASE_CANDIDATE_EXPECTED_TREE="$(git rev-parse 'HEAD^{tree}')"
          export RELEASE_CANDIDATE_EXPECTED_COMMIT RELEASE_CANDIDATE_EXPECTED_TREE
          make integration-test round6-development-artifacts round6-cpa-store-contract
          jq -e \
            --arg commit "$RELEASE_CANDIDATE_EXPECTED_COMMIT" \
            --arg tree "$RELEASE_CANDIDATE_EXPECTED_TREE" \
            '.commit == $commit and .tree == $tree and
             .version == .source_version and .dirty == false' \
            dist/build-metadata.json >/dev/null
      - name: artifact-hash
        run: make artifact-hash
      - name: Seal exact-merge audit candidate manifest
        run: |
          set -euo pipefail

          artifact_version="$(jq -er '.version' dist/build-metadata.json)"
          [[ "$artifact_version" == 0.16 ]] || {
            echo "unexpected audit-candidate version: $artifact_version" >&2
            exit 1
          }

          base_artifacts=(
            "cyber-abuse-guard-v${artifact_version}.so"
            "cyber-abuse-guard-v${artifact_version}.so.sha256"
            "cyber-abuse-guard_${artifact_version}_linux_amd64.zip"
            build-metadata.json
            checksums.txt
            ruleset-manifest.json
            ruleset.sha256
            sbom.cdx.json
          )
          mapfile -t expected_base < <(printf '%s\n' "${base_artifacts[@]}" | LC_ALL=C sort)
          mapfile -d '' -t actual_base < <(
            find dist -mindepth 1 -maxdepth 1 -printf '%f\0' | LC_ALL=C sort -z
          )
          if (( ${#actual_base[@]} != ${#expected_base[@]} )); then
            echo 'audit-candidate dist/ does not contain exactly the eight base artifacts' >&2
            diff -u \
              <(printf '%s\n' "${expected_base[@]}") \
              <(printf '%s\n' "${actual_base[@]}") >&2 || true
            exit 1
          fi
          for index in "${!expected_base[@]}"; do
            [[ "${actual_base[$index]}" == "${expected_base[$index]}" ]] || {
              echo 'audit-candidate dist/ base artifact set differs from the allowlist' >&2
              diff -u \
                <(printf '%s\n' "${expected_base[@]}") \
                <(printf '%s\n' "${actual_base[@]}") >&2 || true
              exit 1
            }
          done

          artifact_records="$(
            for name in "${base_artifacts[@]}"; do
              path="dist/$name"
              [[ -f "$path" && ! -L "$path" ]] || {
                echo "audit-candidate artifact is not a regular non-symlink file: $path" >&2
                exit 1
              }
              jq -cn \
                --arg name "$name" \
                --arg sha256 "$(sha256sum "$path" | awk '{print $1}')" \
                --argjson bytes "$(stat -c %s "$path")" \
                '{name: $name, sha256: $sha256, bytes: $bytes}'
            done | jq -s .
          )"

          source_commit="$GITHUB_SHA"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          manifest_schema='cyber-abuse-guard.audit-candidate-manifest.v1'
          manifest_status='UNRELEASED / SECOND-MACHINE AUDIT CANDIDATE / NOT RELEASE'
          manifest_path='dist/audit-candidate-manifest.json'
          manifest_tmp="$(mktemp "$RUNNER_TEMP/cag-audit-candidate-manifest.XXXXXX")"
          trap 'rm -f -- "$manifest_tmp"' EXIT

          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$source_commit" ]]
          jq -S -n \
            --arg schema "$manifest_schema" \
            --arg status "$manifest_status" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit "$source_commit" \
            --arg tree "$source_tree" \
            --arg version "$artifact_version" \
            --argjson artifacts "$artifact_records" \
            '{
              schema: $schema,
              status: $status,
              event: $event,
              run_id: $run_id,
              run_attempt: $run_attempt,
              commit: $commit,
              tree: $tree,
              dirty: false,
              version: $version,
              artifacts: $artifacts
            }' >"$manifest_tmp"
          chmod 0644 "$manifest_tmp"
          mv -- "$manifest_tmp" "$manifest_path"
          trap - EXIT

          jq -e \
            --arg schema "$manifest_schema" \
            --arg status "$manifest_status" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit "$source_commit" \
            --arg tree "$source_tree" \
            --arg version "$artifact_version" \
            --argjson artifacts "$artifact_records" \
            '.schema == $schema and .status == $status and
             .event == $event and .run_id == $run_id and .run_attempt == $run_attempt and
             .commit == $commit and .tree == $tree and .dirty == false and
             .version == $version and .artifacts == $artifacts' \
            "$manifest_path" >/dev/null

          final_artifacts=("${base_artifacts[@]}" audit-candidate-manifest.json)
          mapfile -t expected_final < <(printf '%s\n' "${final_artifacts[@]}" | LC_ALL=C sort)
          mapfile -d '' -t actual_final < <(
            find dist -mindepth 1 -maxdepth 1 -printf '%f\0' | LC_ALL=C sort -z
          )
          if (( ${#actual_final[@]} != ${#expected_final[@]} )); then
            echo 'audit-candidate dist/ does not contain exactly the nine sealed files' >&2
            exit 1
          fi
          for index in "${!expected_final[@]}"; do
            [[ "${actual_final[$index]}" == "${expected_final[$index]}" ]] || {
              echo 'sealed audit-candidate file set differs from the allowlist' >&2
              exit 1
            }
          done
      - name: safe-evidence-summary
        run: |
          artifact_version="$(jq -er '.version' dist/build-metadata.json)"
          jq -r '
            "artifact_commit=" + (.commit // "unknown" | tostring),
            "artifact_version=" + (.version // "unknown" | tostring),
            "artifact_dirty=" + (.dirty | tostring),
            "classifier_policy=" + (.classifier_policy_version // "unknown" | tostring),
            "classifier_policy_sha256=" + (.classifier_policy_sha256 // "unknown" | tostring),
            "streaming_scanner=" + (.streaming_scanner // "unknown" | tostring)
          ' dist/build-metadata.json
          for artifact in \
            "dist/cyber-abuse-guard-v${artifact_version}.so" \
            "dist/cyber-abuse-guard-v${artifact_version}.so.sha256" \
            "dist/cyber-abuse-guard_${artifact_version}_linux_amd64.zip" \
            dist/build-metadata.json \
            dist/checksums.txt \
            dist/ruleset-manifest.json \
            dist/ruleset.sha256 \
            dist/sbom.cdx.json \
            dist/audit-candidate-manifest.json; do
            printf 'artifact_path=%s artifact_bytes=%s ' "$artifact" "$(stat -c %s "$artifact")"
            sha256sum "$artifact"
          done
          echo 'integration_summary=CPA v7.2.116 source/fail-open, SDK ABI/API, and Linux Host .so load checks completed'
          echo 'cpa_primary_identity=v7.2.116@a88197f845c979132c8978ea223c6af05cc81536'
      - name: clean-tree-check
        run: make clean-tree-check
      - name: Upload exact-merge clean audit candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyber-abuse-guard-linux-amd64-audit-candidate
          path: |
            dist/cyber-abuse-guard-v0.16.so
            dist/cyber-abuse-guard-v0.16.so.sha256
            dist/cyber-abuse-guard_0.16_linux_amd64.zip
            dist/build-metadata.json
            dist/checksums.txt
            dist/ruleset-manifest.json
            dist/ruleset.sha256
            dist/sbom.cdx.json
            dist/audit-candidate-manifest.json
          if-no-files-found: error
          retention-days: 14
  reproducibility:
    needs: quality-and-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Round6 safe sparse source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.round9-local-sandbox/**
            !/cmd/**/*[Ee][Vv][Aa][Ll][Uu][Aa][Tt][Ii][Oo][Nn]*
            !/cmd/**/*[Hh][Oo][Ll][Dd][Oo][Uu][Tt]*
            !/cmd/**/*[Cc][Oo][Nn][Ss][Uu][Mm][Ee][Dd]*
            !/cmd/**/*[Pp][Rr][Ii][Vv][Aa][Tt][Ee]*
            !/cmd/**/*[Bb][Ll][Ii][Nn][Dd]*
            !/cmd/**/*[Rr][Ee][Tt][Ii][Rr][Ee][Dd]*
            !/docs/**/*[Ee][Vv][Aa][Ll][Uu][Aa][Tt][Ii][Oo][Nn]*
            !/docs/**/*[Hh][Oo][Ll][Dd][Oo][Uu][Tt]*
            !/docs/**/*[Hh][Oo][Ll][Dd][Oo][Uu][Tt]_[Rr][Ee][Pp][Oo][Rr][Tt].[Mm][Dd]
            !/docs/**/*[Cc][Oo][Nn][Ss][Uu][Mm][Ee][Dd]*
            !/docs/**/*[Pp][Rr][Ii][Vv][Aa][Tt][Ee]*
            !/docs/**/*[Bb][Ll][Ii][Nn][Dd]*
            !/docs/**/*[Rr][Ee][Tt][Ii][Rr][Ee][Dd]*
            !/internal/classifier/**/*[Ee][Vv][Aa][Ll][Uu][Aa][Tt][Ii][Oo][Nn]*
            !/internal/classifier/**/*[Hh][Oo][Ll][Dd][Oo][Uu][Tt]*
            !/internal/classifier/**/*[Cc][Oo][Nn][Ss][Uu][Mm][Ee][Dd]*
            !/internal/classifier/**/*[Pp][Rr][Ii][Vv][Aa][Tt][Ee]*
            !/internal/classifier/**/*[Bb][Ll][Ii][Nn][Dd]*
            !/internal/classifier/**/*[Rr][Ee][Tt][Ii][Rr][Ee][Dd]*
            !/testdata/**/*[Ee][Vv][Aa][Ll][Uu][Aa][Tt][Ii][Oo][Nn]*
            !/testdata/**/*[Hh][Oo][Ll][Dd][Oo][Uu][Tt]*
            !/testdata/round9-independent-benign-v1/**
            !/testdata/round9-independent-malicious-v1/**
            !/testdata/**/*[Cc][Oo][Nn][Ss][Uu][Mm][Ee][Dd]*
            !/testdata/**/*[Pp][Rr][Ii][Vv][Aa][Tt][Ee]*
            !/testdata/**/*[Bb][Ll][Ii][Nn][Dd]*
            !/testdata/**/*[Rr][Ee][Tt][Ii][Rr][Ee][Dd]*
      - name: Recheck restricted-data and active-workflow contracts
        run: python3 -B scripts/round6_safe_gate_contract.py --root .
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install reproducibility dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential binutils file jq zip unzip
          mkdir -p "$RUNNER_TEMP/bin"
          # shellcheck disable=SC2086
          GOBIN="$RUNNER_TEMP/bin" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Download exact-merge clean audit candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cyber-abuse-guard-linux-amd64-audit-candidate
          path: dist
      - name: Verify downloaded exact-merge audit candidate manifest
        run: |
          set -euo pipefail

          artifact_version=0.16
          base_artifacts=(
            "cyber-abuse-guard-v${artifact_version}.so"
            "cyber-abuse-guard-v${artifact_version}.so.sha256"
            "cyber-abuse-guard_${artifact_version}_linux_amd64.zip"
            build-metadata.json
            checksums.txt
            ruleset-manifest.json
            ruleset.sha256
            sbom.cdx.json
          )
          expected_files=("${base_artifacts[@]}" audit-candidate-manifest.json)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_files[@]}" | LC_ALL=C sort)
          mapfile -d '' -t actual_sorted < <(
            find dist -mindepth 1 -maxdepth 1 -printf '%f\0' | LC_ALL=C sort -z
          )
          if (( ${#actual_sorted[@]} != ${#expected_sorted[@]} )); then
            echo 'downloaded audit candidate is not the exact nine-file closed set' >&2
            diff -u \
              <(printf '%s\n' "${expected_sorted[@]}") \
              <(printf '%s\n' "${actual_sorted[@]}") >&2 || true
            exit 1
          fi
          for index in "${!expected_sorted[@]}"; do
            [[ "${actual_sorted[$index]}" == "${expected_sorted[$index]}" ]] || {
              echo 'downloaded audit-candidate file set differs from the allowlist' >&2
              exit 1
            }
          done
          for name in "${expected_files[@]}"; do
            [[ -f "dist/$name" && ! -L "dist/$name" ]] || {
              echo "downloaded audit-candidate entry is not a regular non-symlink file: $name" >&2
              exit 1
            }
          done

          source_commit="$GITHUB_SHA"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$(git rev-parse HEAD)" == "$source_commit" ]]
          expected_names="$(printf '%s\n' "${base_artifacts[@]}" | jq -R . | jq -s .)"
          manifest='dist/audit-candidate-manifest.json'
          jq -e \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit "$source_commit" \
            --arg tree "$source_tree" \
            --arg version "$artifact_version" \
            --argjson expected_names "$expected_names" \
            '.schema == "cyber-abuse-guard.audit-candidate-manifest.v1" and
             .status == "UNRELEASED / SECOND-MACHINE AUDIT CANDIDATE / NOT RELEASE" and
             .event == $event and .run_id == $run_id and .run_attempt == $run_attempt and
             .commit == $commit and .tree == $tree and .dirty == false and
             .version == $version and
             ([.artifacts[].name] == $expected_names) and
             ([.artifacts[].name] | length) ==
               ([.artifacts[].name] | unique | length) and
             all(.artifacts[];
               (.sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
               (.bytes | type == "number" and . >= 0 and floor == .))' \
            "$manifest" >/dev/null

          jq -e \
            --arg commit "$source_commit" \
            --arg tree "$source_tree" \
            --arg version "$artifact_version" \
            '.commit == $commit and .tree == $tree and
             .version == $version and .source_version == $version and .dirty == false' \
            dist/build-metadata.json >/dev/null

          for name in "${base_artifacts[@]}"; do
            manifest_sha256="$(
              jq -er --arg name "$name" \
                '[.artifacts[] | select(.name == $name)] |
                 if length == 1 then .[0].sha256 else error("artifact identity is not unique") end' \
                "$manifest"
            )"
            manifest_bytes="$(
              jq -er --arg name "$name" \
                '[.artifacts[] | select(.name == $name)] |
                 if length == 1 then .[0].bytes else error("artifact identity is not unique") end' \
                "$manifest"
            )"
            actual_sha256="$(sha256sum "dist/$name" | awk '{print $1}')"
            actual_bytes="$(stat -c %s "dist/$name")"
            [[ "$actual_sha256" == "$manifest_sha256" ]] || {
              echo "manifest SHA-256 mismatch for $name" >&2
              exit 1
            }
            [[ "$actual_bytes" == "$manifest_bytes" ]] || {
              echo "manifest byte-count mismatch for $name" >&2
              exit 1
            }
          done

          printf 'audit_candidate_manifest_sha256=%s\n' \
            "$(sha256sum "$manifest" | awk '{print $1}')"
      - name: Reproduce exact-merge clean audit candidate in two clean clones
        env:
          RELEASE_CANDIDATE_BUILD: '1'
          ROUND6_REPRODUCIBILITY_MODE: release
          ROUND6_SAFE_SPARSE_BUILD: '1'
        run: |
          RELEASE_CANDIDATE_EXPECTED_COMMIT="$GITHUB_SHA"
          RELEASE_CANDIDATE_EXPECTED_TREE="$(git rev-parse 'HEAD^{tree}')"
          export RELEASE_CANDIDATE_EXPECTED_COMMIT RELEASE_CANDIDATE_EXPECTED_TREE
          make round6-reproducibility-test
      - name: clean-tree-check
        run: make clean-tree-check

  fuzz-long:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Round6 safe sparse source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.round9-local-sandbox/**
            !/cmd/**/*[Ee][Vv][Aa][Ll][Uu][Aa][Tt][Ii][Oo][Nn]*
            !/cmd/**/*[Hh][Oo][Ll][Dd][Oo][Uu][Tt]*
            !/cmd/**/*[Cc][Oo][Nn][Ss][Uu][Mm][Ee][Dd]*
            !/cmd/**/*[Pp][Rr][Ii][Vv][Aa][Tt][Ee]*
            !/cmd/**/*[Bb][Ll][Ii][Nn][Dd]*
            !/cmd/**/*[Rr][Ee][Tt][Ii][Rr][Ee][Dd]*
            !/docs/**/*[Ee][Vv][Aa][Ll][Uu][Aa][Tt][Ii][Oo][Nn]*
            !/docs/**/*[Hh][Oo][Ll][Dd][Oo][Uu][Tt]*
            !/docs/**/*[Hh][Oo][Ll][Dd][Oo][Uu][Tt]_[Rr][Ee][Pp][Oo][Rr][Tt].[Mm][Dd]
            !/docs/**/*[Cc][Oo][Nn][Ss][Uu][Mm][Ee][Dd]*
            !/docs/**/*[Pp][Rr][Ii][Vv][Aa][Tt][Ee]*
            !/docs/**/*[Bb][Ll][Ii][Nn][Dd]*
            !/docs/**/*[Rr][Ee][Tt][Ii][Rr][Ee][Dd]*
            !/internal/classifier/**/*[Ee][Vv][Aa][Ll][Uu][Aa][Tt][Ii][Oo][Nn]*
            !/internal/classifier/**/*[Hh][Oo][Ll][Dd][Oo][Uu][Tt]*
            !/internal/classifier/**/*[Cc][Oo][Nn][Ss][Uu][Mm][Ee][Dd]*
            !/internal/classifier/**/*[Pp][Rr][Ii][Vv][Aa][Tt][Ee]*
            !/internal/classifier/**/*[Bb][Ll][Ii][Nn][Dd]*
            !/internal/classifier/**/*[Rr][Ee][Tt][Ii][Rr][Ee][Dd]*
            !/testdata/**/*[Ee][Vv][Aa][Ll][Uu][Aa][Tt][Ii][Oo][Nn]*
            !/testdata/**/*[Hh][Oo][Ll][Dd][Oo][Uu][Tt]*
            !/testdata/round9-independent-benign-v1/**
            !/testdata/round9-independent-malicious-v1/**
            !/testdata/**/*[Cc][Oo][Nn][Ss][Uu][Mm][Ee][Dd]*
            !/testdata/**/*[Pp][Rr][Ii][Vv][Aa][Tt][Ee]*
            !/testdata/**/*[Bb][Ll][Ii][Nn][Dd]*
            !/testdata/**/*[Rr][Ee][Tt][Ii][Rr][Ee][Dd]*
      - name: Recheck restricted-data and active-workflow contracts
        run: python3 -B scripts/round6_safe_gate_contract.py --root .
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - id: fuzz
        run: |
          go test ./internal/extract -run='^$' -fuzz='^FuzzExtractText$' -fuzztime=30s
          go test ./internal/extract -run='^$' -fuzz='^FuzzExtractRequestContentType$' -fuzztime=30s
          go test ./internal/extract -run='^$' -fuzz='^FuzzExtractRequestMediaMemberOrder$' -fuzztime=60s
          go test ./internal/extract -run='^$' -fuzz='^FuzzExtractRequestScalarMediaCarrierPermutation$' -fuzztime=60s
          go test ./internal/extract -run='^$' -fuzz='^FuzzExtractRequestMultipart$' -fuzztime=60s
          go test ./internal/extract -run='^$' -fuzz='^FuzzExtractRequestMultipartUnknownFieldEvidenceOrder$' -fuzztime=60s
          go test ./internal/extract -run='^$' -fuzz='^FuzzRound6JSONStringChunkDecoderMatchesStdlib$' -fuzztime=60s
          go test ./internal/classifier -run='^$' -fuzz='^FuzzClassifier$' -fuzztime=30s
          go test ./internal/classifier -run='^$' -fuzz='^FuzzRound6StreamingChunkAndRoleBoundaries$' -fuzztime=60s
          go test ./internal/classifier -run='^$' -fuzz='^FuzzMetaOverrideClausePermutation$' -fuzztime=30s
          go test ./internal/classifier -run='^$' -fuzz='^FuzzMetaOverrideEncodingAndPartSplit$' -fuzztime=30s
          go test ./internal/classifier -run='^$' -fuzz='^FuzzDefensiveQuotedSampleBoundary$' -fuzztime=30s
          go test ./internal/config -run='^$' -fuzz='^FuzzConfigParser$' -fuzztime=30s
      - name: Collect newly generated Go fuzz failure corpus
        id: collect_fuzz
        if: ${{ failure() && steps.fuzz.outcome == 'failure' }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/go-fuzz-failures"
          mkdir -p "$destination"

          while IFS= read -r -d '' corpus; do
            case "$corpus" in
              internal/*/testdata/fuzz/Fuzz*/*) ;;
              *)
                echo "refusing unexpected fuzz corpus path: $corpus" >&2
                exit 1
                ;;
            esac
            [[ "$(basename "$corpus")" =~ ^[0-9a-f]{16}$ ]] || {
              echo "refusing unexpected fuzz corpus filename: $corpus" >&2
              exit 1
            }
            [[ "$(head -n 1 "$corpus")" == "go test fuzz v1" ]] || {
              echo "refusing non-Go fuzz corpus file: $corpus" >&2
              exit 1
            }
            install -D -m 0600 "$corpus" "$destination/$corpus"
          done < <(git ls-files --others --exclude-standard -z -- \
            ':(glob)internal/*/testdata/fuzz/Fuzz*/*')
      - name: Upload Go fuzz failure corpus
        if: ${{ failure() && steps.fuzz.outcome == 'failure' && steps.collect_fuzz.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-fuzz-failure
          path: ${{ runner.temp }}/go-fuzz-failures
          if-no-files-found: warn
          retention-days: 7
