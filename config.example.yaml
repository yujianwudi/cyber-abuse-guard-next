# Production also requires a regular mode-0600 secret file mounted read-only:
# CYBER_ABUSE_GUARD_HMAC_KEY_FILE=/run/secrets/cyber-abuse-guard-hmac.key
# Never commit the secret or put it in this YAML.

# Round 17 active CPA v7.2.145 compatibility target (commit
# d9cea8904b14fbbebb77ef26e98ef08f6b48a724, C ABI 1 / RPC schema 4).
# Round 15 v7.2.142/schema 3 results remain historical and transfer no PASS.
# Every /v1/realtime* route currently bypasses CAG RequestInterceptor,
# ModelRouter, and request lifecycle: OUT_OF_SCOPE / UNPROTECTED. This example
# protects only registered callback paths such as chat and Responses and makes
# no all-traffic coverage claim. The controls below retain the conservative
# request-log privacy baseline established on historical v7.2.116 evidence and
# require fresh exact-v7.2.145 Host validation. commercial-mode is the
# critical startup control that omits the request-logging middleware, including
# its HTTP 403 error-only raw request-body log path. request-log: false alone is
# not sufficient. After changing the on-disk CPA configuration, recreate or
# restart CPA; hot reload cannot remove middleware installed during startup.
# The management config endpoint exposes current values only. Production must
# also pass check-production-health.sh with CPA_LOG_DIR bound to the actual,
# empty CPA runtime log root and CPA_DIRECT_BASE_URL bound to the process-local
# CPA listener (never a reverse proxy) so its active startup-middleware proof
# can run.
commercial-mode: true
request-log: false
logging-to-file: false

# Keep the v7.2.145 rewrite disabled in the conservative example until the
# exact candidate passes the native Linux Host matrix. The integration suite
# separately forces true to exercise the pre-RequestInterceptor path.
codex:
  optimize-multi-agent-v2: false

plugins:
  enabled: true
  dir: plugins
  configs:
    cyber-abuse-guard:
      enabled: true
      priority: 300
      # CPA v7.2.145 Multi-Agent v2 rewrites /v1/responses tool definitions
      # before RequestInterceptor. Do not promote this configuration from
      # historical v7.2.116 CI, second-machine, or five-repository results;
      # first pass the exact-v7.2.145 rewritten-tool regression.
      # Sandbox/candidate default only. Production rollout remains prohibited
      # until the documented Host, audit, evaluation, and formal-release gates pass.
      mode: observe

      # Legacy compatibility alias. It now selects the bounded text window;
      # it no longer truncates raw JSON or caps cumulative inspected text.
      max_scan_bytes: 262144
      # Prefer this explicit key for new configurations. If both keys are
      # present they must match.
      # max_text_window_bytes: 262144
      max_total_text_bytes: 8388608
      # Omit to derive a safe value from total text, window size, and logical
      # text-part capacity.
      # max_classification_chunks: 2048
      max_json_depth: 32
      max_text_parts: 512

      # block|audit|allow. If omitted: off=allow,
      # observe/audit/balanced=audit, strict=block. The plugin never fetches
      # public media URLs and never decodes image/audio/video bytes.
      opaque_media_policy: audit

      thresholds:
        audit: 35
        balanced_block: 60
        hard_block: 80

      allow_context:
        ctf: true
        lab: true
        authorized_testing: true
        defensive_analysis: true
        remediation: true
        malware_static_analysis: true

      hard_block_even_if_authorized:
        credential_theft: true
        phishing_deployment: true
        ransomware_deployment: true
        data_exfiltration: true

      subject_control:
        # Opt in only after Observe/Audit review. The safe startup default does
        # not correlate requests or accumulate cross-request subject risk.
        enabled: false
        # false keeps risk/cooldown/manual-block state in memory only; restart
        # clears it. true requires audit.enabled,
        # audit.require_persistent_storage=true, an explicit absolute
        # audit.data_dir, max_subjects <= 10000, and a stable
        # CYBER_ABUSE_GUARD_HMAC_KEY_FILE.
        persistence: false
        max_subjects: 10000
        window_minutes: 60
        cooldown_score: 150
        manual_block_score: 250
        cooldown_minutes: 30

      audit:
        enabled: true
        # Production must mount this directory from a dedicated writable Linux
        # volume. Do not place it on CPA's auth tmpfs or the container layer.
        # The path is immutable during plugin hot reconfiguration; changing it
        # requires a controlled CPA/plugin restart so an uncommitted candidate
        # cannot migrate a different SQLite database.
        data_dir: /plugin-data/cyber-abuse-guard
        # Keeps enforcement available on storage failure, but sets
        # operational_ready=false so deployment promotion fails closed.
        require_persistent_storage: true
        retention_days: 30
        # Runtime hard cap over SQLite live pages. The writer measures after
        # every bounded batch, removes oldest Raw Capture rows before ordinary
        # events, and rejects later audit writes if the fixed schema or a
        # storage failure prevents recovery. Classification still continues;
        # authenticated status exposes the degraded/over-limit state.
        max_db_mb: 256
        # Observe never persists per-request events and therefore does not hash
        # the request body for this field. Audit/enforcing modes compute it only
        # when an event is actually persisted.
        log_request_hash: true
        log_subject_hash: true
        log_rule_ids: true
        log_category: true
        # Complete non-user/untrusted category-free wrapper-only findings update
        # counters without a request/subject hash or SQLite row. Trusted-user
        # wrapper findings retain per-request audit attribution.
        # Set true only when per-request wrapper correlation is operationally
        # required; blocks, base Cyber Abuse findings, incomplete inspection,
        # and opaque-media dispositions are always persisted when audit is on.
        persist_wrapper_only: false
        # Compatibility field: true is always rejected. There is no debug
        # mode that persists unrestricted original prompt/request text.
        log_original_text: false
        # Sensitive operator-only false-positive review. Disabled by default;
        # enabling it requires require_persistent_storage=true and a verified
        # production volume.
        # When enabled, only requests whose final disposition prevents upstream
        # routing (block, including subject cooldown) receive a separate
        # redacted, UTF-8-safe truncated preview. Redaction is best
        # effort and must not be treated as a complete DLP boundary.
        raw_capture:
          enabled: false
          # Safety invariants: false values are rejected.
          only_blocked: true
          redact_secrets: true
          # 1..1048576 bytes per stored preview; redaction runs first.
          max_bytes: 8192
          # 1..87600 hours; when enabled, no longer than retention_days * 24.
          ttl_hours: 72
        # The current durable audit schema is v7. Opening a supported v1-v6
        # database creates a mandatory exact SQLite Online Backup plus a
        # SHA-256/quick_check manifest before the atomic v7 migration.
        backup_before_migration: true
        max_migration_backups: 3

      trusted_proxy:
        # CPA v7.2.145 request interception lacks a trustworthy direct-peer address;
        # v1.0.0 therefore rejects enabled: true instead of trusting spoofable headers.
        enabled: false
        header: X-Forwarded-For
        cidrs: []

      # Reserved for a future local-only classifier; v1.0.0 rejects enabled: true.
      classifier:
        enabled: false
        endpoint: ""
        timeout_ms: 300
        fail_mode: rules_only

    # Disable after Cyber Abuse Guard is installed and verified.
    antigravity-coding-filter:
      enabled: false
