name: Round 9 protected CPA Host validation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated RC tag (must be v0.16-rc.4)
        required: true
        type: string
      expected_tag_object_sha:
        description: Exact annotated tag object SHA
        required: true
        type: string
      expected_commit:
        description: Exact main commit at the RC tag
        required: true
        type: string
      expected_tree:
        description: Exact source tree at the RC tag
        required: true
        type: string
      phase1_run_id:
        description: Successful private-candidate release workflow run ID
        required: true
        type: string
      phase1_run_attempt:
        description: Exact successful private-candidate run attempt
        required: true
        type: string
      phase1_artifact_id:
        description: Exact private 17-asset artifact ID
        required: true
        type: string
      phase1_artifact_digest:
        description: GitHub sha256 digest of the private artifact ZIP
        required: true
        type: string
      candidate_identity:
        description: Canonical inline JSON binding SO, classifier, ruleset, build, and release-manifest SHA-256 identities
        required: true
        type: string
      challenge:
        description: Fresh lowercase 64-hex one-shot evaluation challenge
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: round9-external-evaluation-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  external-evaluation:
    environment:
      name: round9-host-validation
    runs-on:
      - self-hosted
      - linux
      - x64
      - cag-round9-sandbox
    timeout-minutes: 180
    steps:
      # Deliberately no checkout. The reviewed root installation owns the PAT,
      # encrypted corpus, keys, evaluator, adapter, image identities and ledger.
      - name: Execute fixed root-owned external evaluation broker
        env:
          OUTPUT: /var/lib/cag-round9-eval-broker/public/${{ github.run_id }}-${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TAG_OBJECT_SHA: ${{ inputs.expected_tag_object_sha }}
          COMMIT: ${{ inputs.expected_commit }}
          TREE: ${{ inputs.expected_tree }}
          PHASE1_RUN_ID: ${{ inputs.phase1_run_id }}
          PHASE1_RUN_ATTEMPT: ${{ inputs.phase1_run_attempt }}
          PHASE1_ARTIFACT_ID: ${{ inputs.phase1_artifact_id }}
          PHASE1_ARTIFACT_DIGEST: ${{ inputs.phase1_artifact_digest }}
          CANDIDATE_IDENTITY: ${{ inputs.candidate_identity }}
          CHALLENGE: ${{ inputs.challenge }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" == v0.16-rc.4 ]]
          [[ "$DISPATCH_REF" == "refs/tags/$TAG" ]]
          [[ "$DISPATCH_SHA" == "$COMMIT" ]]
          [[ "$WORKFLOW_REF" == "${REPOSITORY}/.github/workflows/round9-host-validation.yml@refs/tags/$TAG" ]]
          [[ "$WORKFLOW_SHA" == "$COMMIT" ]]
          sudo -n -- /usr/local/libexec/cag-round9-eval-broker evaluate \
            --repository "$REPOSITORY" \
            --tag "$TAG" \
            --tag-object-sha "$TAG_OBJECT_SHA" \
            --commit "$COMMIT" \
            --tree "$TREE" \
            --phase1-run-id "$PHASE1_RUN_ID" \
            --phase1-run-attempt "$PHASE1_RUN_ATTEMPT" \
            --phase1-artifact-id "$PHASE1_ARTIFACT_ID" \
            --phase1-artifact-digest "$PHASE1_ARTIFACT_DIGEST" \
            --candidate-identity "$CANDIDATE_IDENTITY" \
            --challenge "$CHALLENGE" \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --workflow-run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --dispatch-ref "$DISPATCH_REF" \
            --dispatch-sha "$DISPATCH_SHA" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --output "$OUTPUT"

      - name: Attest exact signed external evaluation and ledger proof
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            /var/lib/cag-round9-eval-broker/public/${{ github.run_id }}-${{ github.run_attempt }}/round9-external-evaluation.json
            /var/lib/cag-round9-eval-broker/public/${{ github.run_id }}-${{ github.run_attempt }}/round9-external-ledger-proof.json

      - name: Upload exact public external evaluation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: round9-external-evaluation-${{ inputs.expected_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /var/lib/cag-round9-eval-broker/public/${{ github.run_id }}-${{ github.run_attempt }}/round9-external-evaluation.json
            /var/lib/cag-round9-eval-broker/public/${{ github.run_id }}-${{ github.run_attempt }}/round9-external-ledger-proof.json
          if-no-files-found: error
          retention-days: 30
