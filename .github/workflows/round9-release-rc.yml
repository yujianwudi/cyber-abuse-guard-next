            dist/rc-release-manifest.json
            dist/rc-release-manifest.json.sha256
            dist/rc-release-test-summary.txt
            dist/rc-release-test-summary.txt.sha256
            dist/ruleset-manifest.json
            dist/ruleset.sha256
            dist/sbom.cdx.json

      - name: Verify exact-candidate independent-audit package or report NOT_PROVIDED
        env:
          EXPECTED_TAG_OBJECT: ${{ inputs.expected_tag_object_sha }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
          AUDIT_REPOSITORY: ${{ vars.ROUND9_INDEPENDENT_AUDITOR_REPOSITORY }}
          AUDIT_WORKFLOW_NAME: ${{ vars.ROUND9_INDEPENDENT_AUDITOR_WORKFLOW_NAME }}
          AUDIT_WORKFLOW: ${{ vars.ROUND9_INDEPENDENT_AUDITOR_WORKFLOW }}
          AUDIT_REF: ${{ vars.ROUND9_INDEPENDENT_AUDITOR_REF }}
          AUDIT_WORKFLOW_SHA: ${{ vars.ROUND9_INDEPENDENT_AUDITOR_WORKFLOW_SHA }}
          AUDIT_RUN_ID: ${{ vars.ROUND9_INDEPENDENT_AUDIT_RUN_ID }}
          AUDIT_RUN_ATTEMPT: ${{ vars.ROUND9_INDEPENDENT_AUDIT_RUN_ATTEMPT }}
          AUDIT_ARTIFACT_ID: ${{ vars.ROUND9_INDEPENDENT_AUDIT_ARTIFACT_ID }}
          AUDIT_ARTIFACT_NAME: ${{ vars.ROUND9_INDEPENDENT_AUDIT_ARTIFACT_NAME }}
          AUDIT_ARTIFACT_DIGEST: ${{ vars.ROUND9_INDEPENDENT_AUDIT_ARTIFACT_DIGEST }}
          AUDIT_CHALLENGE: ${{ vars.ROUND9_INDEPENDENT_AUDIT_CHALLENGE }}
          AUDIT_PUBLIC_KEY_BASE64: ${{ vars.ROUND9_INDEPENDENT_AUDITOR_PUBLIC_KEY_BASE64 }}
          AUDIT_PUBLIC_KEY_SHA256: ${{ vars.ROUND9_INDEPENDENT_AUDITOR_PUBLIC_KEY_SHA256 }}
          AUDIT_KEY_ID: ${{ vars.ROUND9_INDEPENDENT_AUDITOR_KEY_ID }}
          HOST_EVALUATOR_PUBLIC_KEY_SHA256: ${{ vars.ROUND9_EVALUATOR_PUBLIC_KEY_SHA256 }}
          AUDIT_LEDGER_RULESET_ID: ${{ vars.ROUND9_INDEPENDENT_AUDIT_LEDGER_RULESET_ID }}
          AUDIT_LEDGER_RULESET_NAME: ${{ vars.ROUND9_INDEPENDENT_AUDIT_LEDGER_RULESET_NAME }}
          GH_TOKEN: ${{ secrets.ROUND9_INDEPENDENT_AUDIT_REMOTE_VERIFY_TOKEN }}
        run: |
          set -euo pipefail
          audit_root="$RUNNER_TEMP/round9-independent-audit"
          evidence="$audit_root/round9-independent-audit.json"
          proof="$audit_root/round9-independent-audit-ledger-proof.json"
          public_key="$audit_root/round9-independent-auditor-public-key.pem"

          missing=false
          for value in \
            "$AUDIT_REPOSITORY" "$AUDIT_WORKFLOW_NAME" "$AUDIT_WORKFLOW" \
            "$AUDIT_REF" "$AUDIT_WORKFLOW_SHA" "$AUDIT_RUN_ID" \
            "$AUDIT_RUN_ATTEMPT" "$AUDIT_ARTIFACT_ID" "$AUDIT_ARTIFACT_NAME" \
            "$AUDIT_ARTIFACT_DIGEST" "$AUDIT_CHALLENGE" \
            "$AUDIT_PUBLIC_KEY_BASE64" "$AUDIT_PUBLIC_KEY_SHA256" \
            "$AUDIT_KEY_ID" "$HOST_EVALUATOR_PUBLIC_KEY_SHA256" \
            "$AUDIT_LEDGER_RULESET_ID" "$AUDIT_LEDGER_RULESET_NAME" "$GH_TOKEN"; do
            [[ -n "$value" ]] || missing=true
          done
          if [[ "$missing" == true ]]; then
            python3 -B scripts/round9_independent_audit_contract.py verify-remote \
              --evidence "$evidence" --proof "$proof" --asset-dir dist \
              --public-key "$public_key" --public-key-sha256 "$AUDIT_PUBLIC_KEY_SHA256" \
              --host-evaluator-public-key-sha256 "$HOST_EVALUATOR_PUBLIC_KEY_SHA256" \
              --key-id "$AUDIT_KEY_ID" --repository "$GITHUB_REPOSITORY" \
              --tag v0.16-rc.4 --tag-object-sha "$EXPECTED_TAG_OBJECT" \
              --commit "$EXPECTED_COMMIT" --tree "$EXPECTED_TREE" \
              --challenge "$AUDIT_CHALLENGE" --auditor-repository "$AUDIT_REPOSITORY" \
              --auditor-workflow-name "$AUDIT_WORKFLOW_NAME" \
              --auditor-workflow "$AUDIT_WORKFLOW" --auditor-ref "$AUDIT_REF" \
              --auditor-workflow-sha "$AUDIT_WORKFLOW_SHA" \
              --auditor-run-id "$AUDIT_RUN_ID" --auditor-run-attempt "$AUDIT_RUN_ATTEMPT" \
              --ledger-ruleset-id "$AUDIT_LEDGER_RULESET_ID" \
              --ledger-ruleset-name "$AUDIT_LEDGER_RULESET_NAME" \
              --audit-artifact-id "$AUDIT_ARTIFACT_ID" \
              --audit-artifact-name "$AUDIT_ARTIFACT_NAME" \
              --audit-artifact-digest "$AUDIT_ARTIFACT_DIGEST"
          fi

          [[ "$AUDIT_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$AUDIT_WORKFLOW" =~ ^\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml$ ]]
          [[ "$AUDIT_REF" =~ ^refs/(heads|tags)/[^[:space:]]+$ ]]
          [[ "$AUDIT_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AUDIT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$AUDIT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$AUDIT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$AUDIT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$AUDIT_CHALLENGE" =~ ^[0-9a-f]{64}$ ]]
          [[ "$AUDIT_PUBLIC_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$HOST_EVALUATOR_PUBLIC_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$AUDIT_LEDGER_RULESET_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$AUDIT_LEDGER_RULESET_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_.:-]{2,127}$ ]]
          [[ "$GH_TOKEN" != *$'\n'* && "$GH_TOKEN" != *$'\r'* ]]

          mkdir -m 0700 "$audit_root"
          archive="$(mktemp "$RUNNER_TEMP/round9-independent-audit.XXXXXX.zip")"
          artifact="$(gh api "repos/${AUDIT_REPOSITORY}/actions/artifacts/${AUDIT_ARTIFACT_ID}")"
          jq -e --arg repo "$AUDIT_REPOSITORY" --arg name "$AUDIT_ARTIFACT_NAME" \
            --arg digest "$AUDIT_ARTIFACT_DIGEST" --argjson id "$AUDIT_ARTIFACT_ID" \
            --argjson run "$AUDIT_RUN_ID" '
              .id == $id and .name == $name and .digest == $digest and
              .expired == false and .workflow_run.id == $run and
              (.size_in_bytes | type == "number" and . == floor and . > 0 and . <= 4194304)
            ' <<<"$artifact" >/dev/null
          gh api --header 'Accept: application/octet-stream' \
            "repos/${AUDIT_REPOSITORY}/actions/artifacts/${AUDIT_ARTIFACT_ID}/zip" >"$archive"
          [[ "sha256:$(sha256sum "$archive" | awk '{print $1}')" == "$AUDIT_ARTIFACT_DIGEST" ]]
          python3 -B - "$archive" "$audit_root" <<'PY'
          import pathlib, stat, sys, zipfile

          source, destination = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          expected = {
              "round9-independent-audit.json",
              "round9-independent-audit-ledger-proof.json",
          }
          with zipfile.ZipFile(source) as archive:
              infos = archive.infolist()
              names = [item.filename for item in infos]
              if len(infos) != 2 or set(names) != expected or len(names) != len(set(names)):
                  raise SystemExit("independent-audit artifact allowlist mismatch")
              if any(item.is_dir() or pathlib.PurePosixPath(item.filename).name != item.filename for item in infos):
                  raise SystemExit("independent-audit artifact contains a non-top-level entry")
              if any(item.flag_bits & 1 or item.file_size > 1048576 for item in infos):
                  raise SystemExit("independent-audit artifact entry is encrypted or oversized")
              if sum(item.file_size for item in infos) > 2097152:
                  raise SystemExit("independent-audit artifact expands beyond the reviewed bound")
              for item in infos:
                  mode = item.external_attr >> 16
                  if mode and not stat.S_ISREG(mode):
                      raise SystemExit("independent-audit artifact entry is not regular")
                  target = destination / item.filename
                  with target.open("xb") as output:
                      output.write(archive.read(item))
          PY
          umask 077
          (set -o noclobber; : >"$public_key")
          printf '%s' "$AUDIT_PUBLIC_KEY_BASE64" | base64 --decode >"$public_key"
          [[ "$(sha256sum "$public_key" | awk '{print $1}')" == "$AUDIT_PUBLIC_KEY_SHA256" ]]
          chmod 0644 "$public_key"

          for name in round9-independent-audit.json round9-independent-audit-ledger-proof.json; do
            gh attestation verify "$audit_root/$name" --repo "$AUDIT_REPOSITORY" \
              --signer-workflow "$AUDIT_REPOSITORY/$AUDIT_WORKFLOW" \
              --signer-digest "$AUDIT_WORKFLOW_SHA" --source-ref "$AUDIT_REF" \
              --source-digest "$AUDIT_WORKFLOW_SHA" >/dev/null
          done
          python3 -B scripts/round9_independent_audit_contract.py verify-remote \
            --evidence "$evidence" --proof "$proof" --asset-dir dist \
            --public-key "$public_key" --public-key-sha256 "$AUDIT_PUBLIC_KEY_SHA256" \
            --host-evaluator-public-key-sha256 "$HOST_EVALUATOR_PUBLIC_KEY_SHA256" \
            --key-id "$AUDIT_KEY_ID" --repository "$GITHUB_REPOSITORY" \
            --tag v0.16-rc.4 --tag-object-sha "$EXPECTED_TAG_OBJECT" \
            --commit "$EXPECTED_COMMIT" --tree "$EXPECTED_TREE" \
            --challenge "$AUDIT_CHALLENGE" --auditor-repository "$AUDIT_REPOSITORY" \
            --auditor-workflow-name "$AUDIT_WORKFLOW_NAME" \
            --auditor-workflow "$AUDIT_WORKFLOW" --auditor-ref "$AUDIT_REF" \
            --auditor-workflow-sha "$AUDIT_WORKFLOW_SHA" \
            --auditor-run-id "$AUDIT_RUN_ID" --auditor-run-attempt "$AUDIT_RUN_ATTEMPT" \
            --ledger-ruleset-id "$AUDIT_LEDGER_RULESET_ID" \
            --ledger-ruleset-name "$AUDIT_LEDGER_RULESET_NAME" \
            --audit-artifact-id "$AUDIT_ARTIFACT_ID" \
            --audit-artifact-name "$AUDIT_ARTIFACT_NAME" \
            --audit-artifact-digest "$AUDIT_ARTIFACT_DIGEST"

  publication_blocked:
    needs:
      - admission
      - build
    if: ${{ needs.admission.outputs.publication_permitted == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fail closed after retaining the private candidate artifact
        run: |
          [[ "$ROUND9_NEW_PUBLIC_PRERELEASE_CREATION" == \
            BLOCKED_PENDING_EXACT_CANDIDATE_INDEPENDENT_AUDIT_GATE ]]
          printf '%s\n' \
            'The private 17-asset candidate remains available as an Actions artifact.' \
            'No new public Round 9 prerelease can be created by this workflow.' \
            'Required exact-candidate independent-audit evidence is NOT_PROVIDED; the implemented verifier therefore remains fail-closed.' >&2
          exit 1

  verify_published:
    needs: admission
    # Existing Releases are rejected by admission. This legacy read-only
    # verifier remains unreachable until an independent-audit gate replaces it.
    if: ${{ needs.admission.outputs.publication_permitted == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Verify existing immutable Round 9 Release without mutation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          title='v0.16-rc.4 - Round 9 counted-Mock candidate; independent audit required'
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          jq -e --arg commit "$EXPECTED_COMMIT" --arg title "$title" '
            .draft == false and .immutable == true and .prerelease == true and
            .target_commitish == $commit and .name == $title and
            (.assets | length == 19 and all(.state == "uploaded") and
              ([.[].name] | length) == ([.[].name] | unique | length))
          ' <<<"$release" >/dev/null
          expected="$(printf '%s\n' \
            build-metadata.json checksums.txt \
            cyber-abuse-guard-v0.16-rc.4.so cyber-abuse-guard-v0.16-rc.4.so.sha256 \
            cyber-abuse-guard_0.16-rc.4_linux_amd64.zip \
            cyber-abuse-guard-v0.16-rc.4-audit-bundle.zip \
            cyber-abuse-guard-v0.16-rc.4-source.tar.gz \
            cyber-abuse-guard-v0.16-rc.4-source.tar.gz.sha256 \
            rc-release-evidence.md rc-release-evidence.md.sha256 \
            rc-release-manifest.json rc-release-manifest.json.sha256 \
            rc-release-test-summary.txt rc-release-test-summary.txt.sha256 \
            round9-external-evaluation.json round9-external-ledger-proof.json \
            ruleset-manifest.json ruleset.sha256 sbom.cdx.json | LC_ALL=C sort)"
          [[ "$(jq -r '.assets[].name' <<<"$release" | LC_ALL=C sort)" == "$expected" ]]
          mkdir -m 0700 "$RUNNER_TEMP/published"
          while IFS= read -r name; do
            asset="$(jq -ce --arg name "$name" '[.assets[] | select(.name == $name)] | if length == 1 then .[0] else error("asset mismatch") end' <<<"$release")"
            id="$(jq -er '.id' <<<"$asset")"
            gh api --header 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" >"$RUNNER_TEMP/published/$name"
            [[ "$(jq -r '.digest' <<<"$asset")" == "sha256:$(sha256sum "$RUNNER_TEMP/published/$name" | awk '{print $1}')" ]]
          done <<<"$expected"
          (cd "$RUNNER_TEMP/published" && sha256sum -c checksums.txt && sha256sum -c rc-release-manifest.json.sha256)
          manifest="$RUNNER_TEMP/published/rc-release-manifest.json"
          body="$(jq -er '.round9.release.body' "$manifest")"
          [[ "$(jq -r '.round9.release.asset_allowlist[]' "$manifest" | LC_ALL=C sort)" == "$expected" ]]
          jq -e --arg title "$title" --arg body "$body" --arg commit "$EXPECTED_COMMIT" '
            .schema_version == 6 and .release_phase == "publish" and
            .round9.corpus.public_adversarial.payload_records == 24 and
            .round9.corpus.public_adversarial.unique_historical_payloads == 8 and
            .round9.corpus.public_adversarial.unique_branch_head_payloads == 1 and
            .round9.corpus.public_adversarial.unique_current_prompt_like_payloads == 14 and
            .round9.corpus.public_adversarial.unique_formal_payloads == 23 and
            .round9.corpus.public_adversarial.unmerged_candidate_carriers == 1 and
            .round9.corpus.public_adversarial.nondefault_branch_candidate_carriers == 5 and
            .round9.corpus.public_adversarial.release_assets_reviewed == 16 and
            .round9.corpus.public_adversarial.release_assets_with_prompt_entries == 4 and
            .round9.corpus.public_adversarial.release_asset_metadata_records == 199 and
            .round9.corpus.public_adversarial.candidate_carrier_executions == 1 and
            .round9.corpus.public_adversarial.candidate_carriers_not_provided == 0 and
            .round9.corpus.public_adversarial.scenario_payload_executions == 24 and
            .round9.corpus.public_adversarial.serialized_route_executions == 120 and
            .round9.corpus.public_adversarial.direct_active_blocked == 12 and
            .round9.corpus.public_adversarial.direct_active_allowed == 12 and
            .round9.machine_reports.public_adversarial.schema == "round9-public-adversarial-report/v13" and
            .round9.external_evaluation.schema == "round9-external-evaluation/v3" and
            .round9.external_evaluation.state == "PASS" and
            .round9.external_evaluation.public_counted_mock.schema ==
              "round9-public-counted-mock/v1" and
            .round9.external_evaluation.public_counted_mock.state == "PASS" and
            .round9.external_evaluation.public_counted_mock.development_only == true and
            .round9.external_evaluation.public_counted_mock.independent_holdout == false and
            .round9.external_evaluation.public_counted_mock.third_party_code_executed == false and
            .round9.external_evaluation.public_counted_mock.manifest.schema ==
              "round9-public-adversarial-corpus/v13" and
            .round9.external_evaluation.public_counted_mock.manifest.dataset ==
              "round9-public-adversarial-v13" and
            .round9.external_evaluation.public_counted_mock.route_matrix == {
              modes:["audit","balanced","strict"],
