name: RC Release

run-name: RC v1.0.0-rc.3 from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI push run for the exact protected-main commit
        required: true
        type: string
      codeql_run_id:
        description: Successful CodeQL push run for the exact protected-main commit
        required: true
        type: string
      policy_run_id:
        description: Successful Policy and Corpus Gate push run for the exact protected-main commit
        required: true
        type: string
      second_machine_release_id:
        description: Numeric ID of the fixed second-machine evidence draft Release
        required: true
        type: string
      second_machine_asset_id:
        description: Numeric ID of second-machine-release-admission.json in that draft
        required: true
        type: string
      second_machine_asset_sha256:
        description: Lowercase SHA-256 of the canonical second-machine admission bytes
        required: true
        type: string
      authorize_prerelease:
        description: Seal the audited candidate and publish the fixed v1.0.0-rc.3 prerelease
        required: true
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: rc-release-v1.0.0-rc.3
  cancel-in-progress: false

env:
  RC_TAG: v1.0.0-rc.3
  # Tag admission is intentionally based on GitHub's immutable verification
  # record.  The policy is also written into the release evidence so a
  # successful boolean alone cannot be mistaken for a signer authorization.
  RC_TAG_SIGNER_POLICY: github-verification-verified-valid-annotated-tag-and-commit
  RC_SOURCE_VERSION: '1.0.0'
  RC_BINARY_VERSION: '1.0.0'
  RC_ARTIFACT_VERSION: 1.0.0-rc.3
  RC_CPA_VERSION: v7.2.145
  RC_CPA_COMMIT: d9cea8904b14fbbebb77ef26e98ef08f6b48a724
  RC_CPA_C_ABI: '1'
  RC_CPA_RPC_SCHEMA: '4'
  RC_CANDIDATE_ARTIFACT_NAME: cyber-abuse-guard-linux-amd64-audit-candidate
  RC_SECOND_MACHINE_ASSET_NAME: second-machine-release-admission.json
  RC_SECOND_MACHINE_SCHEMA: cyber-abuse-guard.second-machine-release-admission.v3
  RC_SECOND_MACHINE_REQUIRED_STATUS: SECOND_MACHINE_OWNER_RELEASE_ADMISSION_PASS
  RC_SUPPLEMENTAL_ARCHIVE_SHA256: 23000a55f3922c9c2daf04e27d4bdf49d5f95109dd76ba25fa0b3f834c67ed1c
  RC_SUPPLEMENTAL_REQUIRED_STATUS: SUPPLEMENTAL_ARCHIVE_PASS
  RC_NATIVE_HOST_REQUIRED_STATUS: NATIVE_HOST_SPECIAL_PATHS_PASS
  RC_SECOND_MACHINE_STAGING_TAG: v1.0.0-rc.3-second-machine-admission
  RC_PUBLISH_TIMEOUT_SECONDS: '1200'
  RC_CLOCK_MARGIN_SECONDS: '300'
  RC_BUILDER_IMAGE: docker.io/library/golang:1.26.6-bookworm
  RC_BUILDER_IMAGE_DIGEST: sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36
  RC_BUILDER_REFERENCE: docker.io/library/golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36

jobs:
  # Legacy contract markers retained for the real-evidence branch:
  # commit: ${{ steps.evidence.outputs.commit }}
  # tree: ${{ steps.evidence.outputs.tree }}
  # cpa_tag: ${{ steps.evidence.outputs.cpa_tag }}
  # cpa_abi: ${{ steps.evidence.outputs.cpa_abi }}
  # cpa_rpc_schema: ${{ steps.evidence.outputs.cpa_rpc_schema }}
  # corpus_repository_count: ${{ steps.evidence.outputs.corpus_repository_count }}
  # false_positives: ${{ steps.evidence.outputs.false_positives }}
  # malicious_recall_percent: ${{ steps.evidence.outputs.malicious_recall_percent }}
  # side_effect_violations: ${{ steps.evidence.outputs.side_effect_violations }}
  # performance_gates_passed: ${{ steps.evidence.outputs.performance_gates_passed }}
  # cleanup_pass: ${{ steps.evidence.outputs.cleanup_pass }}
  admission:
    name: RC release admission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_artifact_digest: ${{ steps.real_evidence.outputs.candidate_artifact_digest }}
      candidate_artifact_id: ${{ steps.real_evidence.outputs.candidate_artifact_id }}
      candidate_artifact_size: ${{ steps.real_evidence.outputs.candidate_artifact_size }}
      cleanup_pass: ${{ steps.real_evidence.outputs.cleanup_pass }}
      ci_run_attempt: ${{ steps.bind.outputs.ci_run_attempt }}
      codeql_run_attempt: ${{ steps.bind.outputs.codeql_run_attempt }}
      commit: ${{ steps.real_evidence.outputs.commit }}
      corpus_manifest_sha256: ${{ steps.real_evidence.outputs.corpus_manifest_sha256 }}
      corpus_repository_count: ${{ steps.real_evidence.outputs.corpus_repository_count }}
      corpus_source_count: ${{ steps.real_evidence.outputs.corpus_source_count }}
      cpa_binary_sha256: ${{ steps.real_evidence.outputs.cpa_binary_sha256 }}
      cpa_abi: ${{ steps.real_evidence.outputs.cpa_abi }}
      cpa_commit: ${{ steps.real_evidence.outputs.cpa_commit }}
      cpa_rpc_schema: ${{ steps.real_evidence.outputs.cpa_rpc_schema }}
      cpa_tag: ${{ steps.real_evidence.outputs.cpa_tag }}
      false_positives: ${{ steps.real_evidence.outputs.false_positives }}
      independent_proof: ${{ steps.real_evidence.outputs.independent_proof }}
      malicious_recall_percent: ${{ steps.real_evidence.outputs.malicious_recall_percent }}
      owner_run: ${{ steps.real_evidence.outputs.owner_run }}
      performance_gate_count: ${{ steps.real_evidence.outputs.performance_gate_count }}
      performance_gates_passed: ${{ steps.real_evidence.outputs.performance_gates_passed }}
      performance_gates_sha256: ${{ steps.real_evidence.outputs.performance_gates_sha256 }}
      performance_status: ${{ steps.real_evidence.outputs.performance_status }}
      policy_run_attempt: ${{ steps.bind.outputs.policy_run_attempt }}
      protected_commit: ${{ steps.bind.outputs.commit }}
      protected_tree: ${{ steps.bind.outputs.tree }}
      semantic_case_count: ${{ steps.real_evidence.outputs.semantic_case_count }}
      semantic_summary_sha256: ${{ steps.real_evidence.outputs.semantic_summary_sha256 }}
      second_machine_asset_digest: ${{ steps.real_evidence.outputs.second_machine_asset_digest }}
      second_machine_asset_id: ${{ steps.real_evidence.outputs.second_machine_asset_id }}
      second_machine_asset_size: ${{ steps.real_evidence.outputs.second_machine_asset_size }}
      second_machine_expires_at: ${{ steps.real_evidence.outputs.expires_at }}
      second_machine_release_id: ${{ steps.real_evidence.outputs.second_machine_release_id }}
      second_machine_report_sha256: ${{ steps.real_evidence.outputs.report_sha256 }}
      second_machine_so_sha256: ${{ steps.real_evidence.outputs.so_sha256 }}
      second_machine_status: ${{ steps.real_evidence.outputs.status }}
      side_effect_violations: ${{ steps.real_evidence.outputs.side_effect_violations }}
      tag_object: ${{ steps.bind.outputs.tag_object }}
      tag_signer_policy: ${{ steps.bind.outputs.tag_signer_policy }}
      third_party_code_executions: ${{ steps.real_evidence.outputs.third_party_code_executions }}
      tree: ${{ steps.real_evidence.outputs.tree }}
    steps:
      - name: Checkout exact tagged admission validators
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RC_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind fixed annotated tag to exact protected-main required runs
        id: bind
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          AUTHORIZED: ${{ inputs.authorize_prerelease }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CODEQL_RUN_ID: ${{ inputs.codeql_run_id }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          # Keep ordinary read APIs on the ephemeral, read-only workflow token.
          # Governance endpoints are called through governance_api below with
          # the separately managed read-only Administration credential.
          GOVERNANCE_TOKEN: ${{ secrets.CAG_RELEASE_GOVERNANCE_TOKEN }}
          POLICY_RUN_ID: ${{ inputs.policy_run_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          [[ "$AUTHORIZED" == true ]]
          [[ "$GITHUB_REPOSITORY" == yujianwudi/cyber-abuse-guard-next ]]
          [[ "$ACTOR" == yujianwudi ]]
          [[ "$ACTOR_ID" == 153849069 ]]
          [[ "$TRIGGERING_ACTOR" == yujianwudi ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$DISPATCH_REF" == "refs/tags/$RC_TAG" ]]
          [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" == "$DISPATCH_SHA" ]]
          [[ "$WORKFLOW_REF" == "${GITHUB_REPOSITORY}/.github/workflows/release-rc.yml@refs/tags/${RC_TAG}" ]]
          [[ -n "$GH_TOKEN" ]]
          [[ -n "$GOVERNANCE_TOKEN" ]]
          [[ "$RC_TAG_SIGNER_POLICY" == "github-verification-verified-valid-annotated-tag-and-commit" ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CODEQL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$POLICY_RUN_ID" =~ ^[1-9][0-9]*$ ]]

          governance_api() {
            [[ -n "${GOVERNANCE_TOKEN:-}" ]] || return 1
            GH_TOKEN="$GOVERNANCE_TOKEN" gh api "$@"
          }

          main_ref="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main")"
          [[ "$(jq -r '.object.type' <<<"$main_ref")" == commit ]]
          commit="$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$main_ref")"
          [[ "$commit" == "$DISPATCH_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$commit" ]]

          main_branch="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/branches/main")"
          jq -e --arg commit "$commit" '
            .name == "main" and .protected == true and .commit.sha == $commit
          ' <<<"$main_branch" >/dev/null

          repository="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}")"
          jq -e '
            .owner.login == "yujianwudi" and .owner.id == 153849069 and
            .allow_squash_merge == true and .allow_merge_commit == false and
            .allow_rebase_merge == false and .delete_branch_on_merge == true
          ' <<<"$repository" >/dev/null

          protection="$(governance_api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/branches/main/protection")"
          jq -e '
            .required_status_checks.strict == true and
            ([.required_status_checks.checks[] | {context, app_id}] | sort_by(.context)) ==
              ([
                {context:"Analyze Go on Linux", app_id:15368},
                {context:"fuzz-long", app_id:15368},
                {context:"quality-and-artifacts", app_id:15368},
                {context:"reproducibility", app_id:15368},
                {context:"round9-policy-and-corpus", app_id:15368}
              ] | sort_by(.context)) and
            .required_signatures.enabled == true and
            .enforce_admins.enabled == true and
            .required_pull_request_reviews.required_approving_review_count == 0 and
            .required_conversation_resolution.enabled == true and
            .allow_force_pushes.enabled == false and
            .allow_deletions.enabled == false
          ' <<<"$protection" >/dev/null

          immutable_releases="$(governance_api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/immutable-releases")"
          jq -e '.enabled == true' <<<"$immutable_releases" >/dev/null

          actions_permissions="$(governance_api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/permissions")"
          jq -e '
            .enabled == true and .allowed_actions == "selected" and
            .sha_pinning_required == true
          ' <<<"$actions_permissions" >/dev/null
          workflow_permissions="$(governance_api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/permissions/workflow")"
          jq -e '
            .default_workflow_permissions == "read" and
            .can_approve_pull_request_reviews == false
          ' <<<"$workflow_permissions" >/dev/null
          selected_actions="$(governance_api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/permissions/selected-actions")"
          jq -e '
            .github_owned_allowed == true and .verified_allowed == false and
            .patterns_allowed == []
          ' <<<"$selected_actions" >/dev/null

          active_workflows="$RUNNER_TEMP/active-workflows.json"
          gh api --paginate --slurp \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" >"$active_workflows"
          python3 -B scripts/release_rc_workflow_inventory.py --input "$active_workflows"

          branch_pages="$RUNNER_TEMP/repository-branches.json"
          gh api --paginate --slurp \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/branches?per_page=100" >"$branch_pages"
          jq -e '
            ([.[][] | .name] | sort) == ["main"]
          ' "$branch_pages" >/dev/null

          runners="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100")"
          jq -e '.total_count == 0 and .runners == []' <<<"$runners" >/dev/null

          ruleset_pages="$RUNNER_TEMP/release-rulesets.json"
          governance_api --paginate --slurp \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/rulesets?per_page=100" >"$ruleset_pages"
          release_ruleset_id="$(jq -er '
            [.[][] | select(
              .name == "v1.0.0-rc-series-immutable" and
              .target == "tag" and .enforcement == "active"
            )] | if length == 1 then .[0].id else error("expected one active RC tag ruleset") end
          ' "$ruleset_pages")"
          release_ruleset="$(governance_api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/rulesets/${release_ruleset_id}")"
          jq -e '
            .name == "v1.0.0-rc-series-immutable" and
            .target == "tag" and .enforcement == "active" and
            .conditions.ref_name.include == ["refs/tags/v1.0.0-rc.*"] and
            .conditions.ref_name.exclude == [] and
            ([.rules[].type] | sort) == ["deletion", "update"] and
            .bypass_actors == [] and .current_user_can_bypass == "never"
          ' <<<"$release_ruleset" >/dev/null

          tag_ref="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RC_TAG}")"
          [[ "$(jq -r '.object.type' <<<"$tag_ref")" == tag ]]
          tag_object="$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$tag_ref")"
          tag_data="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")"
          [[ "$(jq -r '.tag' <<<"$tag_data")" == "$RC_TAG" ]]
          [[ "$(jq -r '.object.type' <<<"$tag_data")" == commit ]]
          [[ "$(jq -r '.object.sha' <<<"$tag_data")" == "$commit" ]]
          if ! jq -e \
            '.verification.verified == true and .verification.reason == "valid"' \
            <<<"$tag_data" >/dev/null; then
            printf 'RC tag verification must be GitHub-verified with reason=valid\n' >&2
            exit 1
          fi

          commit_data="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/git/commits/${commit}")"
          if ! jq -e --arg commit "$commit" \
            '(.verification // .commit.verification) as $verification |
             .sha == $commit and $verification.verified == true and
             $verification.reason == "valid"' \
            <<<"$commit_data" >/dev/null; then
            printf 'tag target commit must be GitHub-verified with reason=valid\n' >&2
            exit 1
          fi
          tree="$(jq -er '.tree.sha | select(test("^[0-9a-f]{40}$"))' <<<"$commit_data")"
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$tree" ]]
          [[ -z "$(git status --porcelain)" ]]

          formal_refs="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${RC_SOURCE_VERSION}")"
          jq -e --arg formal_tag "refs/tags/v${RC_SOURCE_VERSION}" \
            '[.[] | select(.ref == $formal_tag)] | length == 0' \
            <<<"$formal_refs" >/dev/null

          releases="$RUNNER_TEMP/rc-releases.json"
          gh api --paginate --slurp \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" >"$releases"
          jq -e --arg tag "$RC_TAG" \
            '[.[][] | select(.tag_name == $tag)] | length == 0' \
            "$releases" >/dev/null

          verify_run() {
            local run_id="$1"
            local expected_name="$2"
            local expected_path="$3"
            local response run_attempt
            response="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            # Keep this conditional explicit.  A malformed API response or a
            # non-success conclusion must never become an empty successful
            # command-substitution result under a caller's `set -e` context.
            # The jq program intentionally uses jq variables in a single-quoted
            # filter; expanding these with the shell would change the
            # verification semantics and permit malformed run metadata through.
            # shellcheck disable=SC2016
            if ! jq -e \
                --argjson run_id "$run_id" \
                --arg name "$expected_name" \
                --arg path "$expected_path" \
                --arg repository "$GITHUB_REPOSITORY" \
                --arg commit "$commit" '
                  .id == $run_id and .name == $name and .path == $path and
                  .event == "push" and .head_branch == "main" and
                  (.head_sha | type == "string" and . == $commit) and
                  .status == "completed" and .conclusion == "success" and
                  .repository.full_name == $repository and
                  (.run_attempt | type == "number" and . >= 1 and floor == .)
                ' <<<"$response" >/dev/null; then
              printf 'required workflow run %s failed identity/status admission\n' "$run_id" >&2
              return 1
            fi
            if ! run_attempt="$(jq -er \
                '.run_attempt | select(type == "number" and . >= 1 and floor == .)' \
                <<<"$response")"; then
              printf 'required workflow run %s has no valid run_attempt\n' "$run_id" >&2
              return 1
            fi
            [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]] || {
              printf 'required workflow run %s has a non-integer run_attempt\n' "$run_id" >&2
              return 1
            }
            printf '%s\n' "$run_attempt"
          }

          verify_jobs() {
            local run_id="$1"
            shift
            local pages required
            pages="$RUNNER_TEMP/jobs-${run_id}.json"
            required="$RUNNER_TEMP/jobs-${run_id}-required.json"
            gh api --paginate --slurp \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" >"$pages"
            printf '%s\n' "$@" | jq -R . | jq -s . >"$required"
            # Every required context must occur exactly once and that one job
            # must be completed successfully.  Checking only the set of
            # successful names would allow a duplicate failed job with the
            # same name to be hidden by a successful duplicate.
            jq -e --slurpfile required "$required" '
              ([.[] | .jobs[]]) as $jobs |
              ($required[0]) as $required_names |
              ([$required_names[] as $name |
                [$jobs[] | select(.name == $name)] as $matches |
                (($matches | length) == 1 and
                 $matches[0].status == "completed" and
                 $matches[0].conclusion == "success")
              ] | all)
            ' "$pages" >/dev/null
          }

          ci_attempt="$(verify_run "$CI_RUN_ID" CI .github/workflows/ci.yml)"
          codeql_attempt="$(verify_run "$CODEQL_RUN_ID" CodeQL .github/workflows/codeql.yml)"
          policy_attempt="$(verify_run "$POLICY_RUN_ID" 'Policy and Corpus Gate' .github/workflows/policy-gate.yml)"
          verify_jobs "$CI_RUN_ID" quality-and-artifacts fuzz-long reproducibility
          verify_jobs "$CODEQL_RUN_ID" 'Analyze Go on Linux'
          verify_jobs "$POLICY_RUN_ID" round9-policy-and-corpus

          {
            printf 'commit=%s\n' "$commit"
            printf 'tree=%s\n' "$tree"
            printf 'tag_object=%s\n' "$tag_object"
            printf 'ci_run_attempt=%s\n' "$ci_attempt"
            printf 'codeql_run_attempt=%s\n' "$codeql_attempt"
            printf 'policy_run_attempt=%s\n' "$policy_attempt"
            printf 'tag_signer_policy=%s\n' "$RC_TAG_SIGNER_POLICY"
          } >>"$GITHUB_OUTPUT"

      - name: Download and validate real staged second-machine admission
        id: real_evidence
        env:
          CI_RUN_ATTEMPT: ${{ steps.bind.outputs.ci_run_attempt }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          COMMIT: ${{ steps.bind.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA256: ${{ inputs.second_machine_asset_sha256 }}
          SECOND_MACHINE_ASSET_ID: ${{ inputs.second_machine_asset_id }}
          SECOND_MACHINE_RELEASE_ID: ${{ inputs.second_machine_release_id }}
          TREE: ${{ steps.bind.outputs.tree }}
        run: |
          set -euo pipefail

          [[ "$SECOND_MACHINE_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SECOND_MACHINE_ASSET_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]

          candidate_pages="$RUNNER_TEMP/candidate-artifacts.json"
          staging_release="$RUNNER_TEMP/second-machine-release.json"
          staging_assets="$RUNNER_TEMP/second-machine-release-assets.json"
          staging_asset="$RUNNER_TEMP/second-machine-asset.json"
          report="$RUNNER_TEMP/$RC_SECOND_MACHINE_ASSET_NAME"

          gh api --paginate --slurp \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/artifacts?per_page=100" >"$candidate_pages"
          gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/releases/${SECOND_MACHINE_RELEASE_ID}" >"$staging_release"
          gh api --paginate --slurp \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/releases/${SECOND_MACHINE_RELEASE_ID}/assets?per_page=100" >"$staging_assets"
          gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${SECOND_MACHINE_ASSET_ID}" >"$staging_asset"

          python3 -B scripts/release_rc_github_admission.py \
            --candidate-artifacts "$candidate_pages" \
            --second-machine-release "$staging_release" \
            --second-machine-release-assets "$staging_assets" \
            --second-machine-asset "$staging_asset" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$COMMIT" \
            --ci-run-id "$CI_RUN_ID" \
            --second-machine-release-id "$SECOND_MACHINE_RELEASE_ID" \
            --second-machine-asset-id "$SECOND_MACHINE_ASSET_ID" \
            --second-machine-asset-sha256 "$REPORT_SHA256" \
            --github-output "$GITHUB_OUTPUT"

          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --header 'Accept: application/octet-stream' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/assets/${SECOND_MACHINE_ASSET_ID}" \
            --output "$report"
          [[ -f "$report" && ! -L "$report" ]]
          [[ "$(sha256sum "$report" | awk '{print $1}')" == "$REPORT_SHA256" ]]
          [[ "$(stat -c %s "$report")" == "$(grep '^second_machine_asset_size=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2)" ]]
          jq -e --arg schema "$RC_SECOND_MACHINE_SCHEMA" '.schema == $schema' \
            "$report" >/dev/null

          python3 -B tools/current-cpa-audit/second_machine_release_admission.py validate \
            --report "$report" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-commit "$COMMIT" \
            --expected-tree "$TREE" \
            --expected-candidate-run-id "$CI_RUN_ID" \
            --expected-candidate-run-attempt "$CI_RUN_ATTEMPT" \
            --expected-candidate-artifact-id "$(grep '^candidate_artifact_id=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2)" \
            --expected-candidate-artifact-digest "$(grep '^candidate_artifact_digest=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)" \
            --expected-candidate-artifact-size "$(grep '^candidate_artifact_size=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2)" \
            --minimum-remaining-seconds "$((RC_PUBLISH_TIMEOUT_SECONDS + RC_CLOCK_MARGIN_SECONDS))" \
            --github-output "$GITHUB_OUTPUT"
          [[ "$(grep '^status=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)" == \
            "$RC_SECOND_MACHINE_REQUIRED_STATUS" ]]
          [[ "$(grep '^supplemental_archive_status=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)" == \
            "$RC_SUPPLEMENTAL_REQUIRED_STATUS" ]]
          [[ "$(grep '^supplemental_archive_sha256=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)" == \
            "$RC_SUPPLEMENTAL_ARCHIVE_SHA256" ]]
          [[ "$(grep '^native_host_status=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)" == \
            "$RC_NATIVE_HOST_REQUIRED_STATUS" ]]
          [[ "$(grep '^cpa_tag=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)" == \
            "$RC_CPA_VERSION" ]]
          [[ "$(grep '^cpa_commit=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)" == \
            "$RC_CPA_COMMIT" ]]
          [[ "$(grep '^cpa_abi=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)" == \
            "$RC_CPA_C_ABI" ]]
          [[ "$(grep '^cpa_rpc_schema=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)" == \
            "$RC_CPA_RPC_SCHEMA" ]]

  seal_candidate:
    name: RC Linux amd64 audited-candidate seal and attestation
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    container:
      image: docker.io/library/golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36
    outputs:
      artifact_digest: ${{ format('sha256:{0}', steps.upload.outputs.artifact-digest) }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      attestation_id: ${{ steps.attest.outputs.attestation-id }}
      attestation_url: ${{ steps.attest.outputs.attestation-url }}
    steps:
      - name: Checkout exact restricted RC source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RC_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install bounded seal dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y binutils ca-certificates curl file jq python3 unzip zip
          rm -rf /var/lib/apt/lists/*
          [[ "$(uname -s)" == Linux ]]
          [[ "$(uname -m)" == x86_64 ]]

      - name: Verify exact tagged source identity
        env:
          EXPECTED_COMMIT: ${{ needs.admission.outputs.commit }}
          EXPECTED_TREE: ${{ needs.admission.outputs.tree }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$EXPECTED_TREE" ]]
          [[ "$(git cat-file -t "refs/tags/$RC_TAG")" == tag ]]
          [[ "$(git rev-list -n 1 "$RC_TAG")" == "$EXPECTED_COMMIT" ]]
          [[ -z "$(git status --porcelain)" ]]
          ! git show-ref --verify --quiet "refs/tags/v${RC_SOURCE_VERSION}"

      - name: Download the exact admitted CI audit candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          name: cyber-abuse-guard-linux-amd64-audit-candidate
          path: ${{ runner.temp }}/audit-candidate
          run-id: ${{ inputs.ci_run_id }}

      - name: Verify canonical raw candidate ZIP against API and action output
        env:
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.admission.outputs.candidate_artifact_digest }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.admission.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_SIZE: ${{ needs.admission.outputs.candidate_artifact_size }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          raw_zip="$RUNNER_TEMP/audit-candidate.raw.zip"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            --output "$raw_zip"
          python3 -B scripts/release_rc_artifact_zip.py \
            --archive "$raw_zip" \
            --action-directory "$RUNNER_TEMP/audit-candidate" \
            --expected-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --expected-size "$CANDIDATE_ARTIFACT_SIZE"

      - name: Download the exact admitted second-machine report bytes
        env:
          EXPECTED_BYTES: ${{ needs.admission.outputs.second_machine_asset_size }}
          EXPECTED_SHA256: ${{ needs.admission.outputs.second_machine_report_sha256 }}
          GH_TOKEN: ${{ github.token }}
          SECOND_MACHINE_ASSET_ID: ${{ needs.admission.outputs.second_machine_asset_id }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/$RC_SECOND_MACHINE_ASSET_NAME"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --header 'Accept: application/octet-stream' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/assets/${SECOND_MACHINE_ASSET_ID}" \
            --output "$report"
          [[ -f "$report" && ! -L "$report" ]]
          [[ "$(stat -c %s "$report")" == "$EXPECTED_BYTES" ]]
          [[ "$(sha256sum "$report" | awk '{print $1}')" == "$EXPECTED_SHA256" ]]

      - name: Recheck fixed release and CPA contracts
        env:
          CPA_COMPAT_PROFILE: primary
          CPA_COMPAT_REQUIRE_LATEST: '0'
          CPA_COMPAT_VERIFY_REMOTE: '1'
        run: |
          set -euo pipefail
          bash scripts/release-candidate-contract-test.sh
          bash scripts/release-rc-contract-test.sh
          bash scripts/cpa-latest-compat.sh
          python3 -B scripts/release_rc_artifact_zip_test.py
          python3 -B scripts/release_rc_github_admission_test.py
          python3 -B tools/current-cpa-audit/tests/test_second_machine_release_admission.py

      - name: Seal audited candidate bytes as fixed RC assets
        env:
          DIST_DIR: ${{ runner.temp }}/release-dist
          RC_ADMISSION_STATUS: EXACT_PROTECTED_MAIN_CHECKS_PASS
          RC_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.admission.outputs.candidate_artifact_digest }}
          RC_CANDIDATE_ARTIFACT_ID: ${{ needs.admission.outputs.candidate_artifact_id }}
          RC_CANDIDATE_ARTIFACT_SIZE: ${{ needs.admission.outputs.candidate_artifact_size }}
          RC_CI_RUN_ATTEMPT: ${{ needs.admission.outputs.ci_run_attempt }}
          RC_CI_RUN_ID: ${{ inputs.ci_run_id }}
          RC_CODEQL_RUN_ATTEMPT: ${{ needs.admission.outputs.codeql_run_attempt }}
          RC_CODEQL_RUN_ID: ${{ inputs.codeql_run_id }}
          RC_POLICY_RUN_ATTEMPT: ${{ needs.admission.outputs.policy_run_attempt }}
          RC_POLICY_RUN_ID: ${{ inputs.policy_run_id }}
          RC_SECOND_MACHINE_ASSET_DIGEST: ${{ needs.admission.outputs.second_machine_asset_digest }}
          RC_SECOND_MACHINE_ASSET_ID: ${{ needs.admission.outputs.second_machine_asset_id }}
          RC_SECOND_MACHINE_ASSET_SIZE: ${{ needs.admission.outputs.second_machine_asset_size }}
          RC_SECOND_MACHINE_EXPIRES_AT: ${{ needs.admission.outputs.second_machine_expires_at }}
          RC_SECOND_MACHINE_RELEASE_ID: ${{ needs.admission.outputs.second_machine_release_id }}
          RC_SECOND_MACHINE_REPORT_SHA256: ${{ needs.admission.outputs.second_machine_report_sha256 }}
          RC_SECOND_MACHINE_REPORT_SIZE: ${{ needs.admission.outputs.second_machine_asset_size }}
          RC_SECOND_MACHINE_SO_SHA256: ${{ needs.admission.outputs.second_machine_so_sha256 }}
          RC_SECOND_MACHINE_STATUS: ${{ needs.admission.outputs.second_machine_status }}
          RC_TAG_OBJECT_SHA: ${{ needs.admission.outputs.tag_object }}
          RC_TAG_SIGNER_POLICY: ${{ env.RC_TAG_SIGNER_POLICY }}
          RC_TAG_VERIFICATION_STATUS: VERIFIED_SIGNED_ANNOTATED_TAG
          RELEASE_RC_BUILD: '1'
          RELEASE_RC_EXPECTED_COMMIT: ${{ needs.admission.outputs.commit }}
          RELEASE_RC_EXPECTED_TREE: ${{ needs.admission.outputs.tree }}
          RELEASE_RC_TAG: ${{ env.RC_TAG }}
          ROUND6_SAFE_SPARSE_BUILD: '0'
          VERSION: ${{ env.RC_SOURCE_VERSION }}
        run: bash scripts/release-rc.sh seal-candidate "$RUNNER_TEMP/audit-candidate" "$RUNNER_TEMP/$RC_SECOND_MACHINE_ASSET_NAME"

      - name: Generate signed provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-dist/*
          show-summary: true

      - name: Attach and verify signed attestation bundle
        env:
          DIST_DIR: ${{ runner.temp }}/release-dist
          RC_ADMISSION_STATUS: EXACT_PROTECTED_MAIN_CHECKS_PASS
          RC_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.admission.outputs.candidate_artifact_digest }}
          RC_CANDIDATE_ARTIFACT_ID: ${{ needs.admission.outputs.candidate_artifact_id }}
          RC_CANDIDATE_ARTIFACT_SIZE: ${{ needs.admission.outputs.candidate_artifact_size }}
          RC_CI_RUN_ATTEMPT: ${{ needs.admission.outputs.ci_run_attempt }}
          RC_CI_RUN_ID: ${{ inputs.ci_run_id }}
          RC_CODEQL_RUN_ATTEMPT: ${{ needs.admission.outputs.codeql_run_attempt }}
          RC_CODEQL_RUN_ID: ${{ inputs.codeql_run_id }}
          RC_POLICY_RUN_ATTEMPT: ${{ needs.admission.outputs.policy_run_attempt }}
          RC_POLICY_RUN_ID: ${{ inputs.policy_run_id }}
          RC_SECOND_MACHINE_ASSET_DIGEST: ${{ needs.admission.outputs.second_machine_asset_digest }}
          RC_SECOND_MACHINE_ASSET_ID: ${{ needs.admission.outputs.second_machine_asset_id }}
          RC_SECOND_MACHINE_ASSET_SIZE: ${{ needs.admission.outputs.second_machine_asset_size }}
          RC_SECOND_MACHINE_EXPIRES_AT: ${{ needs.admission.outputs.second_machine_expires_at }}
          RC_SECOND_MACHINE_RELEASE_ID: ${{ needs.admission.outputs.second_machine_release_id }}
          RC_SECOND_MACHINE_REPORT_SHA256: ${{ needs.admission.outputs.second_machine_report_sha256 }}
          RC_SECOND_MACHINE_REPORT_SIZE: ${{ needs.admission.outputs.second_machine_asset_size }}
          RC_SECOND_MACHINE_SO_SHA256: ${{ needs.admission.outputs.second_machine_so_sha256 }}
          RC_SECOND_MACHINE_STATUS: ${{ needs.admission.outputs.second_machine_status }}
          RC_TAG_OBJECT_SHA: ${{ needs.admission.outputs.tag_object }}
          RC_TAG_SIGNER_POLICY: ${{ env.RC_TAG_SIGNER_POLICY }}
          RC_TAG_VERIFICATION_STATUS: VERIFIED_SIGNED_ANNOTATED_TAG
          RELEASE_RC_BUILD: '1'
          RELEASE_RC_EXPECTED_COMMIT: ${{ needs.admission.outputs.commit }}
          RELEASE_RC_EXPECTED_TREE: ${{ needs.admission.outputs.tree }}
          RELEASE_RC_TAG: ${{ env.RC_TAG }}
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          REQUIRE_ATTESTATION: '1'
          ROUND6_SAFE_SPARSE_BUILD: '0'
          VERSION: ${{ env.RC_SOURCE_VERSION }}
        run: bash scripts/release-rc.sh attach-attestation "$ATTESTATION_BUNDLE_PATH"

      - name: Upload exact verified RC release assets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
          name: cyber-abuse-guard-v1.0.0-rc.3-linux-amd64-release-assets
          overwrite: false
          path: ${{ runner.temp }}/release-dist/*
          retention-days: 7

  publish_prerelease:
    name: RC prerelease publication
    needs:
      - admission
      - seal_candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Checkout exact tagged release verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RC_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact sealed transfer
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cyber-abuse-guard-v1.0.0-rc.3-linux-amd64-release-assets
          path: ${{ runner.temp }}/release-dist

      - name: Verify exact transfer and final asset contract
        env:
          ARTIFACT_DIGEST: ${{ needs.seal_candidate.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.seal_candidate.outputs.artifact_id }}
          DIST_DIR: ${{ runner.temp }}/release-dist
          GH_TOKEN: ${{ github.token }}
          RC_ADMISSION_STATUS: EXACT_PROTECTED_MAIN_CHECKS_PASS
          RC_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.admission.outputs.candidate_artifact_digest }}
          RC_CANDIDATE_ARTIFACT_ID: ${{ needs.admission.outputs.candidate_artifact_id }}
          RC_CANDIDATE_ARTIFACT_SIZE: ${{ needs.admission.outputs.candidate_artifact_size }}
          RC_CI_RUN_ATTEMPT: ${{ needs.admission.outputs.ci_run_attempt }}
          RC_CI_RUN_ID: ${{ inputs.ci_run_id }}
          RC_CODEQL_RUN_ATTEMPT: ${{ needs.admission.outputs.codeql_run_attempt }}
          RC_CODEQL_RUN_ID: ${{ inputs.codeql_run_id }}
          RC_POLICY_RUN_ATTEMPT: ${{ needs.admission.outputs.policy_run_attempt }}
          RC_POLICY_RUN_ID: ${{ inputs.policy_run_id }}
          RC_SECOND_MACHINE_ASSET_DIGEST: ${{ needs.admission.outputs.second_machine_asset_digest }}
          RC_SECOND_MACHINE_ASSET_ID: ${{ needs.admission.outputs.second_machine_asset_id }}
          RC_SECOND_MACHINE_ASSET_SIZE: ${{ needs.admission.outputs.second_machine_asset_size }}
          RC_SECOND_MACHINE_EXPIRES_AT: ${{ needs.admission.outputs.second_machine_expires_at }}
          RC_SECOND_MACHINE_RELEASE_ID: ${{ needs.admission.outputs.second_machine_release_id }}
          RC_SECOND_MACHINE_REPORT_SHA256: ${{ needs.admission.outputs.second_machine_report_sha256 }}
          RC_SECOND_MACHINE_REPORT_SIZE: ${{ needs.admission.outputs.second_machine_asset_size }}
          RC_SECOND_MACHINE_SO_SHA256: ${{ needs.admission.outputs.second_machine_so_sha256 }}
          RC_SECOND_MACHINE_STATUS: ${{ needs.admission.outputs.second_machine_status }}
          RC_TAG_OBJECT_SHA: ${{ needs.admission.outputs.tag_object }}
          RC_TAG_SIGNER_POLICY: ${{ env.RC_TAG_SIGNER_POLICY }}
          RC_TAG_VERIFICATION_STATUS: VERIFIED_SIGNED_ANNOTATED_TAG
          RELEASE_RC_BUILD: '1'
          RELEASE_RC_EXPECTED_COMMIT: ${{ needs.admission.outputs.commit }}
          RELEASE_RC_EXPECTED_TREE: ${{ needs.admission.outputs.tree }}
          RELEASE_RC_TAG: ${{ env.RC_TAG }}
          REQUIRE_ATTESTATION: '1'
          ROUND6_SAFE_SPARSE_BUILD: '0'
          VERSION: ${{ env.RC_SOURCE_VERSION }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          transfer="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          jq -e \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg digest "$ARTIFACT_DIGEST" '
              .id == $artifact_id and
              .name == "cyber-abuse-guard-v1.0.0-rc.3-linux-amd64-release-assets" and
              .digest == $digest and .expired == false and
              .workflow_run.id == $run_id
            ' <<<"$transfer" >/dev/null
          bash scripts/release-rc.sh verify

      - name: Verify GitHub provenance for every pre-attestation asset
        env:
          COMMIT: ${{ needs.admission.outputs.commit }}
          DIST_DIR: ${{ runner.temp }}/release-dist
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="$DIST_DIR/release-attestation.intoto.jsonl"
          [[ -f "$bundle" && ! -L "$bundle" ]]
          verified=0
          for subject in "$DIST_DIR"/*; do
            [[ -f "$subject" && ! -L "$subject" ]]
            [[ "${subject##*/}" != release-attestation.intoto.jsonl ]] || continue
            result="$RUNNER_TEMP/attestation-verify-${verified}.json"
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$bundle" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-rc.yml" \
              --signer-digest "$COMMIT" \
              --source-ref "refs/tags/$RC_TAG" \
              --source-digest "$COMMIT" \
              --predicate-type 'https://slsa.dev/provenance/v1' \
              --deny-self-hosted-runners \
              --format json >"$result"
            jq -e '
              length >= 1 and all(.[];
                .verificationResult.statement.predicateType == "https://slsa.dev/provenance/v1"
              )
            ' "$result" >/dev/null
            verified=$((verified + 1))
          done
          [[ "$verified" == 18 ]]

      - name: Create verified draft then publish non-latest prerelease
        env:
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.admission.outputs.candidate_artifact_digest }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.admission.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_SIZE: ${{ needs.admission.outputs.candidate_artifact_size }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.admission.outputs.ci_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.ci_run_id }}
          COMMIT: ${{ needs.admission.outputs.commit }}
          DIST_DIR: ${{ runner.temp }}/release-dist
          GH_TOKEN: ${{ github.token }}
          GOVERNANCE_TOKEN: ${{ secrets.CAG_RELEASE_GOVERNANCE_TOKEN }}
          SECOND_MACHINE_ASSET_DIGEST: ${{ needs.admission.outputs.second_machine_asset_digest }}
          SECOND_MACHINE_ASSET_ID: ${{ needs.admission.outputs.second_machine_asset_id }}
          SECOND_MACHINE_ASSET_SIZE: ${{ needs.admission.outputs.second_machine_asset_size }}
          SECOND_MACHINE_RELEASE_ID: ${{ needs.admission.outputs.second_machine_release_id }}
          SECOND_MACHINE_REPORT_SHA256: ${{ needs.admission.outputs.second_machine_report_sha256 }}
          SECOND_MACHINE_STATUS: ${{ needs.admission.outputs.second_machine_status }}
          TAG_OBJECT: ${{ needs.admission.outputs.tag_object }}
          TREE: ${{ needs.admission.outputs.tree }}
        run: |
          set -euo pipefail

          latest_release_id() {
            local body latest status
            body="$(mktemp)"
            status="$(curl --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "$body" --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/latest")"
            case "$status" in
              200)
                if ! latest="$(jq -er '.id | select(type == "number" and . > 0)' "$body")"; then
                  rm -f -- "$body"
                  return 1
                fi
                printf '%s\n' "$latest"
                ;;
              404) printf 'NONE\n' ;;
              *)
                printf 'latest Release query failed with HTTP %s\n' "$status" >&2
                rm -f -- "$body"
                return 1
                ;;
            esac
            rm -f -- "$body"
          }

          verify_tag_unchanged() {
            local commit_data tag_data tag_ref
            tag_ref="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RC_TAG}")"
            if ! jq -e --arg object "$TAG_OBJECT" '
              .object.type == "tag" and .object.sha == $object
            ' <<<"$tag_ref" >/dev/null; then
              printf 'RC annotated tag object changed\n' >&2
              return 1
            fi
            tag_data="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT}")"
            if ! jq -e --arg tag "$RC_TAG" --arg commit "$COMMIT" '
              .tag == $tag and .object.type == "commit" and
              .object.sha == $commit and .verification.verified == true and
              .verification.reason == "valid"
            ' <<<"$tag_data" >/dev/null; then
              printf 'RC tag signature is not GitHub-verified valid\n' >&2
              return 1
            fi
            commit_data="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/git/commits/${COMMIT}")"
            if ! jq -e --arg commit "$COMMIT" '
              (.verification // .commit.verification) as $verification |
              .sha == $commit and $verification.verified == true and
              $verification.reason == "valid"
            ' <<<"$commit_data" >/dev/null; then
              printf 'RC tag target commit is not GitHub-verified valid\n' >&2
              return 1
            fi
          }

          verify_release_assets() {
            local actual_names asset bytes digest expected_names name release_assets
            local release_id="$1"
            release_assets="$(gh api --paginate --slurp \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100")"
            expected_names="$(printf '%s\n' "${assets[@]##*/}" | LC_ALL=C sort)"
            actual_names="$(jq -r '[.[][] | .name] | sort | .[]' <<<"$release_assets")"
            [[ "$actual_names" == "$expected_names" ]]
            for asset in "${assets[@]}"; do
              name="${asset##*/}"
              digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
              bytes="$(stat -c %s "$asset")"
              jq -e --arg name "$name" --arg digest "$digest" --argjson bytes "$bytes" '
                ([.[][] | select(
                  .name == $name and .digest == $digest and
                  .state == "uploaded" and .size == $bytes
                )] | length) == 1
              ' <<<"$release_assets" >/dev/null
            done
          }

          verify_draft_release_exact() {
            local release_id="$1" draft_body draft_json
            draft_json="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
            if ! jq -e \
              --argjson release_id "$release_id" \
              --arg title "Cyber Abuse Guard ${RC_TAG}" \
              --arg tag "$RC_TAG" \
              --arg commit "$COMMIT" '
                .id == $release_id and .name == $title and
                .tag_name == $tag and .target_commitish == $commit and
                .draft == true and .prerelease == true and
                (.make_latest == false or .make_latest == null)
              ' <<<"$draft_json" >/dev/null; then
              printf 'draft Release changed before publication; refusing PATCH\n' >&2
              return 1
            fi
            draft_body="$(mktemp "$RUNNER_TEMP/draft-release-body.XXXXXX")"
            if ! jq -erj '.body | select(type == "string")' \
              <<<"$draft_json" >"$draft_body"; then
              rm -f -- "$draft_body"
              printf 'draft Release body is not a string; refusing PATCH\n' >&2
              return 1
            fi
            if ! cmp -s -- "$DIST_DIR/release-evidence.md" "$draft_body"; then
              rm -f -- "$draft_body"
              printf 'draft Release body differs byte-for-byte; refusing PATCH\n' >&2
              return 1
            fi
            rm -f -- "$draft_body"
            verify_release_assets "$release_id"
          }

          revalidate_second_machine() {
            local staging_release staging_assets staging_asset
            staging_release="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/releases/${SECOND_MACHINE_RELEASE_ID}")"
            jq -e --argjson id "$SECOND_MACHINE_RELEASE_ID" --arg tag "$RC_SECOND_MACHINE_STAGING_TAG" --arg commit "$COMMIT" '
              .id == $id and .draft == true and .tag_name == $tag and
              .target_commitish == $commit and .published_at == null
            ' <<<"$staging_release" >/dev/null
            staging_assets="$(gh api --paginate --slurp \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/releases/${SECOND_MACHINE_RELEASE_ID}/assets?per_page=100")"
            jq -e --argjson id "$SECOND_MACHINE_ASSET_ID" --arg name "$RC_SECOND_MACHINE_ASSET_NAME" \
              --arg digest "$SECOND_MACHINE_ASSET_DIGEST" --argjson bytes "$SECOND_MACHINE_ASSET_SIZE" '
              ([.[][] | select(.id == $id and .name == $name and .state == "uploaded" and
                .digest == $digest and .size == $bytes)] | length) == 1
            ' <<<"$staging_assets" >/dev/null
            staging_asset="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${SECOND_MACHINE_ASSET_ID}")"
            jq -e --argjson id "$SECOND_MACHINE_ASSET_ID" --arg name "$RC_SECOND_MACHINE_ASSET_NAME" \
              --arg digest "$SECOND_MACHINE_ASSET_DIGEST" --argjson bytes "$SECOND_MACHINE_ASSET_SIZE" '
              .id == $id and .name == $name and .state == "uploaded" and
              .digest == $digest and .size == $bytes
            ' <<<"$staging_asset" >/dev/null
            python3 -B tools/current-cpa-audit/second_machine_release_admission.py validate \
              --report "$DIST_DIR/$RC_SECOND_MACHINE_ASSET_NAME" \
              --expected-repository "$GITHUB_REPOSITORY" \
              --expected-commit "$COMMIT" \
              --expected-tree "$TREE" \
              --expected-candidate-run-id "$CANDIDATE_RUN_ID" \
              --expected-candidate-run-attempt "$CANDIDATE_RUN_ATTEMPT" \
              --expected-candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" \
              --expected-candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
              --expected-candidate-artifact-size "$CANDIDATE_ARTIFACT_SIZE" \
              --minimum-remaining-seconds "$((RC_PUBLISH_TIMEOUT_SECONDS + RC_CLOCK_MARGIN_SECONDS))" >/dev/null
          }

          verify_repository_governance() {
            # Keep ordinary repository reads on GITHUB_TOKEN. Only the
            # Administration/Actions metadata calls below use the separately
            # managed governance credential.
            governance_api() {
              [[ -n "${GOVERNANCE_TOKEN:-}" ]] || return 1
              GH_TOKEN="$GOVERNANCE_TOKEN" gh api "$@"
            }
            local actions_permissions immutable_releases main_ref protection release_ruleset
            local release_ruleset_id repository ruleset_pages selected_actions workflow_permissions
            main_ref="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main")"
            jq -e --arg commit "$COMMIT" '
              .object.type == "commit" and .object.sha == $commit
            ' <<<"$main_ref" >/dev/null
            repository="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}")"
            jq -e '
              .owner.login == "yujianwudi" and .owner.id == 153849069 and
              .allow_squash_merge == true and .allow_merge_commit == false and
              .allow_rebase_merge == false and .delete_branch_on_merge == true
            ' <<<"$repository" >/dev/null
            protection="$(governance_api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/branches/main/protection")"
            jq -e '
              .required_status_checks.strict == true and
              ([.required_status_checks.checks[] | {context, app_id}] | sort_by(.context)) ==
                ([
                  {context:"Analyze Go on Linux", app_id:15368},
                  {context:"fuzz-long", app_id:15368},
                  {context:"quality-and-artifacts", app_id:15368},
                  {context:"reproducibility", app_id:15368},
                  {context:"round9-policy-and-corpus", app_id:15368}
                ] | sort_by(.context)) and
              .required_signatures.enabled == true and
              .enforce_admins.enabled == true and
              .required_pull_request_reviews.required_approving_review_count == 0 and
              .required_conversation_resolution.enabled == true and
              .allow_force_pushes.enabled == false and
              .allow_deletions.enabled == false
            ' <<<"$protection" >/dev/null
            immutable_releases="$(governance_api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/immutable-releases")"
            jq -e '.enabled == true' <<<"$immutable_releases" >/dev/null
            actions_permissions="$(governance_api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/permissions")"
            jq -e '
              .enabled == true and .allowed_actions == "selected" and
              .sha_pinning_required == true
            ' <<<"$actions_permissions" >/dev/null
            workflow_permissions="$(governance_api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/permissions/workflow")"
            jq -e '
              .default_workflow_permissions == "read" and
              .can_approve_pull_request_reviews == false
            ' <<<"$workflow_permissions" >/dev/null
            selected_actions="$(governance_api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/permissions/selected-actions")"
            jq -e '
              .github_owned_allowed == true and .verified_allowed == false and
              .patterns_allowed == []
            ' <<<"$selected_actions" >/dev/null
            active_workflows="$RUNNER_TEMP/publish-active-workflows.json"
            gh api --paginate --slurp \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" >"$active_workflows"
            python3 -B scripts/release_rc_workflow_inventory.py --input "$active_workflows"
            branch_pages="$RUNNER_TEMP/publish-branches.json"
            gh api --paginate --slurp \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/branches?per_page=100" >"$branch_pages"
            jq -e '
              ([.[][] | .name] | sort) == ["main"]
            ' "$branch_pages" >/dev/null
            runners="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100")"
            jq -e '.total_count == 0 and .runners == []' <<<"$runners" >/dev/null
            ruleset_pages="$RUNNER_TEMP/publish-rulesets.json"
            governance_api --paginate --slurp \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/rulesets?per_page=100" >"$ruleset_pages"
            release_ruleset_id="$(jq -er '
              [.[][] | select(
                .name == "v1.0.0-rc-series-immutable" and
                .target == "tag" and .enforcement == "active"
              )] | if length == 1 then .[0].id else error("expected one active RC tag ruleset") end
            ' "$ruleset_pages")"
            release_ruleset="$(governance_api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/rulesets/${release_ruleset_id}")"
            jq -e '
              .name == "v1.0.0-rc-series-immutable" and
              .target == "tag" and .enforcement == "active" and
              .conditions.ref_name.include == ["refs/tags/v1.0.0-rc.*"] and
              .conditions.ref_name.exclude == [] and
              ([.rules[].type] | sort) == ["deletion", "update"] and
              .bypass_actors == [] and .current_user_can_bypass == "never"
            ' <<<"$release_ruleset" >/dev/null
          }

          releases="$RUNNER_TEMP/pre-publish-releases.json"
          gh api --paginate --slurp \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" >"$releases"
          jq -e --arg tag "$RC_TAG" \
            '[.[][] | select(.tag_name == $tag)] | length == 0' \
            "$releases" >/dev/null
          verify_tag_unchanged
          latest_before="$(latest_release_id)"

          mapfile -t assets < <(find "$DIST_DIR" -mindepth 1 -maxdepth 1 -type f -printf '%p\n' | LC_ALL=C sort)
          ((${#assets[@]} == 19))
          verify_repository_governance
          revalidate_second_machine
          gh release create "$RC_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --prerelease \
            --latest=false \
            --verify-tag \
            --target "$COMMIT" \
            --title "Cyber Abuse Guard ${RC_TAG}" \
            --notes-file "$DIST_DIR/release-evidence.md"

          releases="$RUNNER_TEMP/draft-releases.json"
          gh api --paginate --slurp \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" >"$releases"
          draft="$(jq -ce --arg tag "$RC_TAG" '
            [.[][] | select(.tag_name == $tag)] |
            if length == 1 then .[0] else error("expected one draft RC Release") end
          ' "$releases")"
          release_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"$draft")"
          jq -e --arg tag "$RC_TAG" --arg commit "$COMMIT" '
            .draft == true and .prerelease == true and
            .tag_name == $tag and .target_commitish == $commit
          ' <<<"$draft" >/dev/null

          verify_release_assets "$release_id"
          verify_draft_release_exact "$release_id"

          verify_repository_governance
          revalidate_second_machine
          verify_tag_unchanged
          # Re-fetch the draft immediately before the state transition.  This
          # closes the title/body/target/asset TOCTOU window after the first
          # draft inspection.
          verify_draft_release_exact "$release_id"
          published="$(gh api --method PATCH \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false -F prerelease=true -f make_latest=false)"
          jq -e --argjson release_id "$release_id" --arg tag "$RC_TAG" --arg commit "$COMMIT" '
            .id == $release_id and .draft == false and .prerelease == true and
            .tag_name == $tag and .target_commitish == $commit
          ' <<<"$published" >/dev/null
          published="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          jq -e --argjson release_id "$release_id" --arg tag "$RC_TAG" --arg commit "$COMMIT" '
            .id == $release_id and .draft == false and .prerelease == true and
            .immutable == true and .name == "Cyber Abuse Guard v1.0.0-rc.3" and
            .tag_name == $tag and .target_commitish == $commit
          ' <<<"$published" >/dev/null
          published_body="$RUNNER_TEMP/published-release-body.md"
          jq -j '.body' <<<"$published" >"$published_body"
          cmp -- "$DIST_DIR/release-evidence.md" "$published_body"
          # GraphQL variables must remain literal for gh to bind via -F.
          # shellcheck disable=SC2016
          graphql_release="$(gh api graphql \
            -f 'query=query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){immutable isDraft isLatest isPrerelease name tagName}}}' \
            -F owner=yujianwudi \
            -F name=cyber-abuse-guard-next \
            -F tag="$RC_TAG")"
          jq -e --arg tag "$RC_TAG" '
            .data.repository.release.immutable == true and
            .data.repository.release.isDraft == false and
            .data.repository.release.isLatest == false and
            .data.repository.release.isPrerelease == true and
            .data.repository.release.name == "Cyber Abuse Guard v1.0.0-rc.3" and
            .data.repository.release.tagName == $tag
          ' <<<"$graphql_release" >/dev/null
          verify_tag_unchanged
          latest_after="$(latest_release_id)"
          [[ "$latest_after" == "$latest_before" ]]
          printf 'published verified non-latest prerelease: %s\n' \
            "$(jq -er '.html_url' <<<"$published")"
