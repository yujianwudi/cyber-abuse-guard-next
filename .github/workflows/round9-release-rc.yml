          jq -e --arg body "$body" '.body == $body' <<<"$release" >/dev/null
          ordinary="$(grep -Fvx -e round9-external-evaluation.json -e round9-external-ledger-proof.json <<<"$expected")"
          while IFS= read -r name; do
            gh attestation verify "$RUNNER_TEMP/published/$name" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/round9-release-rc.yml" \
              --signer-digest "$EXPECTED_COMMIT" --source-ref refs/tags/v0.16-rc.4 \
              --source-digest "$EXPECTED_COMMIT" >/dev/null
          done <<<"$ordinary"
          for name in round9-external-evaluation.json round9-external-ledger-proof.json; do
            gh attestation verify "$RUNNER_TEMP/published/$name" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/round9-host-validation.yml" \
              --signer-digest "$EXPECTED_COMMIT" --source-ref refs/tags/v0.16-rc.4 \
              --source-digest "$EXPECTED_COMMIT" >/dev/null
          done
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          [[ "$latest" == v0.15 ]]
