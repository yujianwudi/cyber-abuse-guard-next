            } and
            .round9.external_evaluation.public_counted_mock.families.historical_unique.unique_payloads == 8 and
            .round9.external_evaluation.public_counted_mock.families.branch_head.unique_payloads == 1 and
            .round9.external_evaluation.public_counted_mock.families.unmerged_candidate_carrier.unique_payloads == 1 and
            .round9.external_evaluation.public_counted_mock.total.unique_payloads == 10 and
            .round9.external_evaluation.public_counted_mock.total.serialized_executions == 120 and
            .round9.external_evaluation.public_counted_mock.total.local_blocked == 80 and
            .round9.external_evaluation.public_counted_mock.total.upstream_delta == 40 and
            .round9.external_evaluation.public_counted_mock.total.usage_delta == 40 and
